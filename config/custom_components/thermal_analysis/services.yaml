predict_runtime:
  name: Predict Heat Pump Runtime
  description: Calculate how many hours the heat pump needs to run based on weather forecasts
  fields:
    outdoor_temp_forecast:
      name: Outdoor Temperature Forecast
      description: List of predicted outdoor temperatures for the next 24 hours (one value per hour)
      required: true
      example: "[5.2, 5.0, 4.8, 5.5, 6.0, 7.2, 8.5, 9.0, 9.5, 10.0, 10.2, 10.5, 10.3, 10.0, 9.5, 9.0, 8.5, 8.0, 7.5, 7.0, 6.5, 6.0, 5.8, 5.5]"
      selector:
        object:
    solar_power_forecast:
      name: Solar Power Forecast
      description: List of predicted solar power output in W for the next 24 hours (one value per hour)
      required: true
      example: "[0, 0, 0, 0, 0, 0, 50, 200, 500, 800, 1000, 1200, 1100, 900, 600, 300, 100, 0, 0, 0, 0, 0, 0, 0]"
      selector:
        object:
    target_temperature:
      name: Target Temperature
      description: Desired indoor temperature (default 20°C)
      required: false
      default: 20.0