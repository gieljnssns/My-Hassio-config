alias: "Verwarming Aan/Uit"
id: faac69de-f54b-4ac5-82c1-4de36624c400
trigger:
  - platform: state
    entity_id: alarm_control_panel.ha_alarm
    to: 'armed_night'
    id: uit
  - platform: state
    entity_id: alarm_control_panel.ha_alarm
    from: 'armed_night'
    to: 'disarmed'
    id: aan
  - platform: template
    value_template: >
      {{ states("binary_sensor.gphone_focus") == "off" and states("device_tracker.gphone_bermuda") == "home" }}
    id: aan_slaapkamer
  - platform: template
    value_template: >
      {{ states("binary_sensor.mphone_focus") == "off" and states("device_tracker.mphone_bermuda") == "home" }}
    id: aan_slaapkamer
  - platform: template
    value_template: >
      {{ states("binary_sensor.nphone_focus") == "off" and states("device_tracker.nphone_bermuda") == "home" }}
    id: aan_slaapkamer_noor
  # - platform: template
  #   value_template: >
  #     {{ states("binary_sensor.fphone_focus") == "off" and states("device_tracker.fphone_bermuda") == "home" }}
  #   id: aan_slaapkamer_fien
actions:
  - choose:
    - conditions:
        - condition: trigger
          id: uit
      sequence:
        - delay:
            minutes: 15
        - action: climate.set_preset_mode
          target:
            entity_id:
              - climate.slaapkamer
              - climate.fien
              - climate.noor
          data:
            preset_mode: away
        - action: automation.turn_off
          target:
            entity_id:
              - automation.verwarming_bij_aanwezigheid_fien
              - automation.verwarming_bij_aanwezigheid_noor
              - automation.verwarming_bij_aanwezigheid_slaapkamer
          data:
            stop_actions: true
    - conditions:
        - condition: trigger
          id: aan
      sequence:
        - action: automation.turn_on
          target:
            entity_id:
              - automation.verwarming_bij_aanwezigheid_fien
    - conditions:
        - condition: trigger
          id: aan_slaapkamer
        - condition: template
          value_template: >
            {{ states("binary_sensor.gphone_focus") == "off" and states("binary_sensor.mphone_focus") == "off" }}
      sequence:
        - action: automation.turn_on
          target:
            entity_id:
              - automation.verwarming_bij_aanwezigheid_slaapkamer
    - conditions:
        - condition: trigger
          id: aan_slaapkamer_noor
      sequence:
        - action: automation.turn_on
          target:
            entity_id:
              - automation.verwarming_bij_aanwezigheid_noor