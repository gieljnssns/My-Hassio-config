    #     - condition: trigger
    #       id: aan_slaapkamer_noor
    #   sequence:
    #     - action: climate.set_preset_mode
    #       target:
    #         entity_id:
    #           - climate.slaapkamer_noor
    #       data:
    #         preset_mode: comfort