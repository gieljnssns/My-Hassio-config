alias: Herstarten smappee
description: "Herstarten Smappee DIY wanneer unknown"
id: 0f92f6c0-97b8-48f3-81f3-a67f84644b06
mode: parallel
trigger:
  - platform: state
    entity_id: sensor.s3
    id: L3
    to: "unknown"
    for:
      minutes: 1
  - platform: state
    entity_id: sensor.v3
    id: L3
    to: "unknown"
    for:
      minutes: 1

  - platform: state
    entity_id: sensor.s2
    id: L2
    to: "unknown"
    for:
      minutes: 1
  - platform: state
    entity_id: sensor.v2
    id: L2
    to: "unknown"
    for:
      minutes: 1

  - platform: state
    entity_id: sensor.s1
    id: L1
    to: "unknown"
    for:
      minutes: 1
  - platform: state
    entity_id: sensor.v1
    id: L1
    to: "unknown"
    for:
      minutes: 1
actions:
  - choose:
      - conditions: 
          - condition: trigger
            id: L1
        sequence:
          - action: switch.turn_on
            entity_id: switch.smappee_l1_herstarten
          - action: persistent_notification.create
            data:
              message: Smappee L1 is herstart omdat er iets onbekend was
      - conditions: 
          - condition: trigger
            id: L2
        sequence:
          - action: switch.turn_on
            entity_id: switch.smappee_l2_herstarten
          - action: persistent_notification.create
            data:
              message: Smappee L3 is herstart omdat er iets onbekend was
      - conditions: 
          - condition: trigger
            id: L3
        sequence:
          - action: switch.turn_on
            entity_id: switch.smappee_l3_herstarten
          - action: persistent_notification.create
            data:
              message: Smappee L3 is herstart omdat er iets onbekend was