alias: "Sociale media af"
id: e123627d-0573-45ab-9f9d-e6232b3f51db
trigger:
  - platform: time
    at: "01:00:00"
  - platform: time
    at: "03:00:00"
    # id: week
    # - platform: template
    #   value_template: >
    #     {{ now().weekday() == 6 and now().hour == 17 }}
    id: zondag
  - platform: time
    at: "09:00:00"
  # - platform: state
  #   entity_id: calendar.noor_school
  #   from: "on"
  #   to: "off"
  #   id: noor_snapchat
  # - platform: state
  #   entity_id: calendar.fien_school
  #   from: "on"
  #   to: "off"
  #   for:
  #     minutes: 1
  #   id: fien_snapchat
  - platform: template
    value_template: >
      {% set weekday = now().weekday() %}
      {% set time = now().strftime('%H:%M') %}
      {% set valid_days_1530 = [0, 1, 3, 4] %}  # Ma, Di, Do, Vr
      {% set valid_days_1200 = [2] %}           # Woensdag
      
      {{ 
        is_state('binary_sensor.schooldag', 'on') and (
          (weekday in valid_days_1530 and time == '15:30') or 
          (weekday in valid_days_1200 and time == '12:00')
        )
      }}
    id: snapchat
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: snapchat
        sequence:
          - action: script.check_todo
            data:
              check: ["Uniform"]
              todo: noor_snapchat
              action: needs_action
          - action: input_boolean.turn_on
            entity_id: input_boolean.noor_snapchat_blocker
      # - conditions:
      #     - condition: trigger
      #       id: fien_snapchat
      #   sequence:
          - action: script.check_todo
            data:
              check: ["Uniform"]
              todo: fien_snapchat
              action: needs_action
          - action: input_boolean.turn_on
            entity_id: input_boolean.fien_snapchat_blocker
      - conditions:
          - condition: time
            weekday:
              - "mon"
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.schooldag
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    entity_id: input_boolean.fien_blocker, input_boolean.noor_blocker
                  # - action: script.check_todo
                  #   data:
                  #     check: ["Piano"]
                  #     todo: noor_todo
                  #     action: needs_action
                  # - action: script.check_todo
                  #   data:
                  #     check: ["Drummen"]
                  #     todo: fien_todo
                  #     action: needs_action
              - conditions:
                  - condition: template
                    value_template: >
                      {{ now().hour == 3 }}
                sequence:
                  - action: input_boolean.turn_on
                    entity_id: input_boolean.fien_blocker, input_boolean.noor_blocker
                  # - action: script.check_todo
                  #   data:
                  #     check: ["Piano"]
                  #     todo: noor_todo
                  #     action: needs_action
                  # - action: script.check_todo
                  #   data:
