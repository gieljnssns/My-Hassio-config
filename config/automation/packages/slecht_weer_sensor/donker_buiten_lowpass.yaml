alias: "Donker buiten lowpass"
id: e80c2c9b-06b3-45f0-b6c2-aac9fb531612
mode: parallel
triggers:

  - trigger: template
    value_template: >
      {{ states("sensor.huidige_opbrengst") | int(0) < 100 and 
        states("sensor.buiten_lichtsterkte") | int(0) < 950 }}
    for:
      minutes: 5
    id: binnen
  - trigger: template
    value_template: >
      {{ states("sensor.huidige_opbrengst") | int(0) < 2 and
        states("sensor.buiten_lichtsterkte") | int(0) < 150 }}
    for:
      minutes: 15
    id: buiten
  - trigger: template
    value_template: >
      {{ states("sensor.huidige_opbrengst") | int(0) < 100 }}
    for:
      minutes: 5
    id: binnen
  - trigger: template
    value_template: >
      {{ states("sensor.huidige_opbrengst") | int(0) < 2 }}
    for:
      minutes: 15
    id: buiten
  - trigger: numeric_state
    entity_id: sensor.buiten_lichtsterkte
    below: 1100
    for:
      minutes: 5
    id: binnen
  # - trigger: numeric_state
  #   entity_id: sensor.estimated_illuminance_normal
  #   below: 250
  - trigger: numeric_state
    entity_id: sensor.buiten_lichtsterkte
    below: 150
    for:
      minutes: 5
    id: buiten
  - trigger: numeric_state
    entity_id: sun.sun
    value_template: "{{ state.attributes.elevation }}"
    below: 0.0
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: buiten
        sequence:
          - action: input_boolean.turn_on
            entity_id:
              - input_boolean.donker_buiten_lowpass
      - conditions:
          - condition: trigger
            id: binnen
        sequence:
          - action: input_boolean.turn_on
            entity_id:
              - input_boolean.donker_binnen_lowpass
    default:
      - action: input_boolean.turn_on
        entity_id:
          - input_boolean.donker_buiten_lowpass
          - input_boolean.donker_binnen_lowpass
  # - action: input_boolean.turn_on
  #   entity_id:
  #     - input_boolean.donker_buiten_lowpass
