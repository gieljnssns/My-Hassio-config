alias: "Alarm disarm"
id: 94a4b642-8571-4080-8c7d-fed9b86375c1
triggers:
  - trigger: state
    entity_id: sensor.giel_status
    to: "Juist Aangekomen"
  - trigger: state
    entity_id: sensor.martine_status
    to: "Juist Aangekomen"
  - trigger: state
    entity_id: sensor.fien_status
    to: "Juist Aangekomen"
  - trigger: state
    entity_id: sensor.noor_status
    to: "Juist Aangekomen"
  - trigger: state
    entity_id: media_player.mass_keuken
    to: playing
  - trigger: state
    entity_id: switch.koffiezet
    from: "off"
    to: "on"
conditions:
  condition: and
  conditions:
    - condition: or
      conditions:
        - condition: state
          entity_id: sensor.giel_status
          state: "Thuis"
        - condition: state
          entity_id: sensor.martine_status
          state: "Thuis"
        - condition: state
          entity_id: sensor.giel_status
          state: "Juist Aangekomen"
        - condition: state
          entity_id: sensor.martine_status
          state: "Juist Aangekomen"
        - condition: state
          entity_id: sensor.fien_status
          state: "Thuis"
        - condition: state
          entity_id: sensor.noor_status
          state: "Thuis"
        - condition: state
          entity_id: sensor.fien_status
          state: "Juist Aangekomen"
        - condition: state
          entity_id: sensor.noor_status
          state: "Juist Aangekomen"
actions:
  - action: alarm_control_panel.alarm_disarm
    entity_id: alarm_control_panel.ha_alarm
    data:
      code: !secret alarm_code
