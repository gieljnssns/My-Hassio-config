alias: "TV Volume op 0 houden"
id: c4175e45-eb8f-44e3-a0b5-0c41d861cbdf
mode: queued
triggers:
  - trigger: time_pattern
    seconds: "/10" # Elke 10 seconden controleren
conditions:
  - condition: state
    entity_id: media_player.philips_tv
    state: "on" # Werkt alleen als de TV aanstaat
actions:
  - action: homeassistant.update_entity
    target:
      entity_id: media_player.philips_tv
  - delay:
      seconds: 2
  - condition: template
    value_template: "{{ state_attr('media_player.philips_tv', 'volume_level') > 0 }}"
  - action: media_player.volume_set
    target:
      entity_id: media_player.philips_tv
    data:
      volume_level: 0
