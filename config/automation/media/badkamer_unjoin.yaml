alias: Badkamer unjoin
id: 5d92af17-35b7-4191-b015-99d5644a0b39
mode: single
triggers:
  - trigger: state
    entity_id: binary_sensor.badkamer_bezetting
    to: "off"
    for:
      minutes: 10
conditions:
  - condition: or
    conditions:
      - condition: state
        entity_id: binary_sensor.badkamer_grouped_not_master
        state: "on"
      - condition: state
        entity_id: media_player.mass_badkamer
        state: "playing"
      - condition: state
        entity_id: media_player.mass_badkamer
        state: "idle"
      - condition: state
        entity_id: media_player.mass_badkamer
        state: "paused"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.badkamer_grouped_not_master
            state: "on"
        sequence:
          - action: media_player.unjoin
            target:
              entity_id: media_player.mass_badkamer
          - delay:
              seconds: 5
          - action: media_player.volume_set
            data:
              volume_level: 0.14
            target:
              entity_id:
                - media_player.mass_badkamer
    default:
      - action: media_player.media_stop
        entity_id: media_player.mass_badkamer
      - delay:
          seconds: 5
      - action: media_player.volume_set
        data:
          volume_level: 0.14
        target:
          entity_id:
            - media_player.mass_badkamer
