alias: EMHASS battery
id: 66809bb1-c454-43a5-899a-c354840b11b6
triggers:
  - trigger: state
    entity_id: script.emhass_discharge_to_98
    from: "on"
    to: "off"
  - trigger: state
    entity_id: input_boolean.emhass_gridfollower
    from: "on"
    to: "off"
  - trigger: state
    entity_id: binary_sensor.battery_dead_zone
    from: "off"
    to: "on"
    id: deadzone
  - trigger: state
    entity_id:
      - script.emhass_publish_models
    from: "on"
    to: "off"

conditions:
  # Controleer of EMHASS sensoren beschikbaar zijn
  - condition: template
    value_template: >
      {{ states("sensor.ridge_p_batt_forecast") not in ['unavailable', 'unknown'] }}
  - condition: template
    value_template: >
      {{ states("sensor.ridge_p_grid_forecast") not in ['unavailable', 'unknown'] }}
  - condition: template
    value_template: >
      {{ states("sensor.battery_state_of_charge") not in ['unavailable', 'unknown'] }}
  - condition: template
    value_template: >
      {{ states("number.goodwe_eco_mode_power") not in ['unavailable', 'unknown'] }}
  - condition: template
    value_template: >
      {{ states("select.goodwe_inverter_operation_mode") not in ['unavailable', 'unknown'] }}

variables:
  p_batt: >-
    {{ states("sensor.ridge_p_batt_forecast") }}

  p_grid: >-
    {{ states("sensor.ridge_p_grid_forecast") }}

  p_sol: >-
    {{ states("sensor.ridge_p_pv_forecast") }}

  # Huidige SOC van batterij
  soc: >-
    {{ states('sensor.battery_state_of_charge') | float(states('sensor.ridge_soc_batt_forecast')|float) }}

  # Bepaal EMHASS batterij modus met originele logica
  emhass_battery_mode: >-
    {% if p_batt == 'unavailable' or p_grid == 'unavailable' -%}
      Unknown
    {% else -%}
      {% set p_batt_val = p_batt | float(0) -%}
      {% set p_grid_val = p_grid | float(0) -%}
      {% set p_sol_val = p_sol | float(0) -%}
      {% set soc_val = soc | float(0) -%}
      {% if p_grid_val == 0  -%}
        {% if p_sol_val > 0  -%}
          {% if p_batt_val < 0  -%}
            Forcible Charge
          {% else -%}
            Forcible Discharge
          {% endif -%}
        {% else -%}
          Follow Grid
        {% endif -%}
      {% elif p_batt_val == 0 -%}
        Forcible Discharge
      {% elif p_batt_val < 0 -%}
        {% if soc_val >= 100 -%}
          Idle
        {% else -%}
          Forcible Charge
        {% endif -%}
      {% elif p_batt_val > 0 -%}
        {% if soc_val <= 10 -%}
          Idle
        {% else -%}
          Forcible Discharge
        {% endif -%}
      {% else -%}
        Unknown
      {% endif -%}
    {% endif -%}

  # Bereken power percentage voor GoodWe (alleen bij force charge/discharge)
  power_percentage: >-
    {% set abs_power = (p_batt | float) | abs -%}
    {% if emhass_battery_mode in ['Forcible Discharge', 'Forcible Charge'] -%}
      {% if abs_power > 8000 -%}
        100
      {% else -%}
        {{ (abs_power / 80) | round(0) }}
      {% endif -%}
    {% else -%}
      0
    {% endif -%}

actions:
  # Stel GoodWe batterij mode in op basis van EMHASS mode
  - choose:
      # DEADZONE
      - conditions:
          - condition: trigger
            id: deadzone
        sequence:
          # Stop de grid-follower regelaar
          - if:
              - condition: state
                entity_id: script.emhass_grid_follower
                state: "on"
            then:
              - action: script.turn_off
                target:
                  entity_id: script.emhass_grid_follower
          - condition: state
            entity_id: script.emhass_discharge_to_98
            state: "off"
          - action: script.turn_on
            target:
              entity_id: script.emhass_discharge_to_98

      # FORCIBLE CHARGE
      - conditions:
          - condition: template
            value_template: "{{ emhass_battery_mode == 'Forcible Charge' }}"
          - condition: state
            entity_id: script.emhass_grid_follower
            state: "off"
          - condition: state
            entity_id: script.emhass_discharge_to_98
            state: "off"
        sequence:
          # Controleer of mode wijziging nodig is
          - if:
              - condition: template
                value_template: "{{ states('select.goodwe_inverter_operation_mode') != 'eco_charge' }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.goodwe_inverter_operation_mode
                data:
                  option: "eco_charge"
          # Controleer of power wijziging nodig is
          - if:
              - condition: template
                value_template: "{{ (states('number.goodwe_eco_mode_power') | float) != (power_percentage | float) }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.goodwe_eco_mode_power
                data:
                  value: "{{ power_percentage }}"
          # Start de grid-follower regelaar (mode: single → start niet opnieuw als al actief)
          - if:
              - condition: state
                entity_id: input_boolean.emhass_gridfollower
                state: "on"
            then:
              - action: script.turn_on
                target:
                  entity_id: script.emhass_grid_follower

      # FORCIBLE DISCHARGE
      - conditions:
          - condition: template
            value_template: "{{ emhass_battery_mode == 'Forcible Discharge' }}"
          - condition: state
            entity_id: script.emhass_grid_follower
            state: "off"
          - condition: state
            entity_id: script.emhass_discharge_to_98
            state: "off"
        sequence:
          # Controleer of mode wijziging nodig is
          - if:
              - condition: template
                value_template: "{{ states('select.goodwe_inverter_operation_mode') != 'eco_discharge' }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.goodwe_inverter_operation_mode
                data:
                  option: "eco_discharge"

          # Controleer of power wijziging nodig is
          - if:
              - condition: template
                value_template: "{{ (states('number.goodwe_eco_mode_power') | float) != (power_percentage | float) }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.goodwe_eco_mode_power
                data:
                  value: "{{ power_percentage }}"
          # Start de grid-follower regelaar (mode: single → start niet opnieuw als al actief)
          - if:
              - condition: state
                entity_id: input_boolean.emhass_gridfollower
                state: "on"
            then:
              - action: script.turn_on
                target:
                  entity_id: script.emhass_grid_follower

      # FOLLOW GRID / IDLE (general mode)
      - conditions:
          - condition: template
            value_template: "{{ emhass_battery_mode in ['Follow Grid', 'Idle'] }}"
        sequence:
          # Controleer of mode wijziging nodig is
          - if:
              - condition: template
                value_template: "{{ states('select.goodwe_inverter_operation_mode') != 'general' }}"
            then:
              - action: select.select_option
                target:
                  entity_id: select.goodwe_inverter_operation_mode
                data:
                  option: "general"
              - action: number.set_value
                target:
                  entity_id: number.goodwe_eco_mode_power
                data:
                  value: 5

    default:
      - action: logbook.log
        data:
          name: "EMHASS GoodWe Control"
          message: "Onbekende EMHASS mode: {{ emhass_battery_mode }}"

mode: restart
