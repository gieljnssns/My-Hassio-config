alias: Zonnetent inschuiven #Sunscreen up/inklappen
id: 48a786d1-0219-4da1-825b-b67e5a770a8d
triggers:
  # Sun based triggers
  - trigger: numeric_state
    entity_id: sensor.sun_azimut
    above: 330
  - trigger: numeric_state
    entity_id: sensor.sun_elevation
    below: -10
  - trigger: state
    entity_id: sensor.dark_inside
    to: "true"
    for:
      minutes: 5
  - trigger: numeric_state
    entity_id: sensor.buiten_lichtsterkte
    below: 10000
    for:
      minutes: 5

  # Weather based triggers
  - trigger: template
    value_template: >
      {{ states("sensor.openweathermap_windsnelheid") | int(0) > 26 }}
  - trigger: template
    value_template: >
      {{ states("sensor.openweathermap_windvlaag_snelheid") | int(0) > 40 }}
  # - trigger: template
  #   value_template: >
  #     {{ states("sensor.buiten_lichtsterkte") | float(0) < 4000 and
  #       (states("sensor.solcast_forecast_next_hour") | float(0) < 1000 or
  #       states("sensor.solcast_forecast_this_hour") | float(0) < 1000) }}

  - trigger: template
    value_template: >
      {% if states("sensor.regen_komende_10_minuten") != "unknown" and states("sensor.regen_komende_10_minuten") != "unavailable" %}
        {{ states("sensor.regen_komende_10_minuten") | float > 0.4 }}
      {% endif %}
  - trigger: template
    value_template: >
      {% if states("sensor.neerslag_zandhoven") != "unknown" and states("sensor.neerslag_zandhoven") != "unavailable" %}
        {{ states("sensor.neerslag_zandhoven") | float > 0.15 }}
      {% else %}
        {{ states("sensor.openweathermap_rain_intensity")  | float > 0.15 }}
      {% endif %}

  - trigger: state
    entity_id: binary_sensor.zonnetent_vibratie
    to: "on"

conditions:
  condition: or
  conditions:
    - condition: template
      value_template: >
        {{ state_attr("cover.zonnetent", "current_position") > 10 }}

actions:
  - action: cover.close_cover
    data: {}
    target:
      entity_id: cover.zonnetent
  # - action: notify.mobile_app_gphone
  #   data_template:
  #     message: "De zonnetent is ingeschoven, reden {{trigger.entity_id}} "
  - delay:
      minutes: 3
  - action: cover.close_cover
    data: {}
    target:
      entity_id: cover.zonnetent
