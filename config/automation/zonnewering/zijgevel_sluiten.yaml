alias: Zijgevel sluiten #Sunscreen down/uitklappen
id: 609710ab-bc42-47f6-a4bf-b70cce8b88a7
triggers:
  - trigger: numeric_state
    entity_id: sensor.buiten_lichtsterkte
    for:
      minutes: 5
    above: 15000
  - trigger: time_pattern
    minutes: "/12"
    seconds: 00
conditions:
  condition: and # all conditions need to be TRUE before action is executed.
  conditions:
    # Sun based conditions
    - condition: numeric_state
      entity_id: sensor.sun_azimut
      above: 110 #
      below: 290
    - condition: numeric_state
      entity_id: sun.sun
      value_template: "{{ state.attributes.elevation }}"
      above: 10
    - condition: numeric_state
      entity_id: sensor.huidige_opbrengst_gefilterd
      above: 650
    # - condition: numeric_state
    #   entity_id: sensor.buiten_lichtsterkte
    #   above: 15000

    # Weather based conditions
    - condition: template
      value_template: >
        {{ states("sensor.openweathermap_windsnelheid") | int(0) < 40 }}
    - condition: template
      value_template: >
        {{ states("sensor.openweathermap_windvlaag_snelheid") | int(0) < 60 }}
    - condition: template
      value_template: >
        {% if states("sensor.regen_komende_10_minuten") != "unknown" and states("sensor.regen_komende_10_minuten") != "unavailable" %}
          {{ states("sensor.regen_komende_10_minuten") | float < 0.15 }}
        {% endif %}
    - condition: template
      value_template: >
        {% if states("sensor.neerslag_zandhoven") != "unknown" and states("sensor.neerslag_zandhoven") != "unavailable" %}
          {{ states("sensor.neerslag_zandhoven") | float < 0.15 }}
        {% else %}
          {{ states("sensor.openweathermap_rain_intensity")  | float < 0.15 }}
        {% endif %}

    - condition: numeric_state
      entity_id: sensor.home_current_uv_index
      above: 3 # This indicates direct sunlight on my location (as in: not cloudy)

    # Temperature based conditions
    - condition: numeric_state
      entity_id: sensor.buitentemperatuur_gefilterd
      above: 19 # only if outdoor temperature is above x then allowed to roll out
    - condition: numeric_state
      entity_id: sensor.gemiddelde_temp_beneden
      above: 22 # only if indoor temperature is above x then allowed to roll out

    - condition: template
      value_template: >
        {{ states("sensor.max_temperatuur_buiten_voorspelling_12u") | float(0) > (states("sensor.gemiddelde_temp_beneden") | float(0) - 2) }}

    # Time based conditions
    - condition: template
      value_template: "{{ now().month > 3 }}" # Starting April
    - condition: template
      value_template: "{{ now().month < 10 }}" # Ending October

    # No others screens are closing
    - condition: state
      entity_id: script.achtergevel_sluiten
      state: "off"
    - condition: state
      entity_id: input_boolean.zijgevel_closed
      state: "off"
    - condition: template
      value_template: >
        {{ state_attr("cover.living", "current_position") > 50 }}
    - condition: template
      value_template: >
        {{ state_attr("cover.slaapkamer_noor", "current_position") > 50 }}

actions:
  - action: script.zijgevel_sluiten
