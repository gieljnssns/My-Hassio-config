alias: Knop Noor 5 klik
id: 40a60f6c-c147-4b72-b7c0-1eb0f85df9eb
trigger:
  - platform: state
    entity_id: binary_sensor.knop_noor_5_klik
    to: "on"
    id: aan
  - platform: event
    event_type: state_changed
    event_data:
      entity_id: input_button.verwarming_1u_noor
    id: aan
  - platform: time
    at: input_datetime.slaapkamer_noor_verwarming_end_time
    id: uit
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: aan
        sequence:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.slaapkamer_noor
            data:
              preset_mode: boost
          - action: input_datetime.set_datetime
            data:
              datetime: >
                {{ now() + timedelta(seconds=3600) }}
            target:
              entity_id: input_datetime.slaapkamer_noor_verwarming_end_time
      - conditions:
          - condition: trigger
            id: uit
        sequence:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.slaapkamer_noor
            data:
              preset_mode: >
                {{ state_attr('climate.slaapkamer', 'preset_mode') }}
