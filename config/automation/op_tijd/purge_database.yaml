alias: "Purge database"
id: ca43a372-7850-436b-94e5-5024377653be
triggers:
  - trigger: time
    at: "03:12:00"
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().hour == 3 }}"
        sequence:
          - action: recorder.purge
            data:
              repack: true
              keep_days: 10
mode: single
