alias: Light gang hal
id: 169e30a6-8d76-4193-83db-a362b6ebca25
description: ""
mode: restart
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: light.gang_boven
    from: "on"
    to: "off"
    id: uit
  - trigger: state
    entity_id: light.gang_boven
    from: "off"
    to: "on"
    id: aan
  - trigger: time
    at: input_datetime.gang_hal_end_time
    id: uit
  - trigger: state
    entity_id: binary_sensor.gang_hal_pir
    from: "off"
    to: "on"
    id: aan

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: uit
        sequence:
          - action: light.turn_off
            data:
              entity_id: light.gang_hal
      - conditions:
          - condition: trigger
            id: aan
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.giel_thuis_nacht
                state: "on"
              - condition: state
                entity_id: binary_sensor.martine_thuis_nacht
                state: "on"
        sequence:
          - action: light.turn_on
            data:
              brightness_pct: 1
            target:
              entity_id: light.gang_hal
          - action: input_datetime.set_datetime
            data:
              datetime: |
                {{ now() + timedelta(hours=1) }}
            target:
              entity_id: input_datetime.gang_hal_end_time
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.gang_hal_bezetting
                from: "on"
                to: "off"
          - action: input_datetime.set_datetime
            data:
              datetime: >
                {{ now() + timedelta(seconds=30) }}
            target:
              entity_id: input_datetime.gang_hal_end_time
      - conditions:
          - condition: trigger
            id: aan
          - condition: state
            entity_id: binary_sensor.gang_hal_bezetting
            state: "on"
        sequence:
          - action: light.turn_on
            data:
              brightness_pct: 100
            target:
              entity_id: light.gang_hal
          - action: input_datetime.set_datetime
            data:
              datetime: |
                {{ now() + timedelta(hours=1) }}
            target:
              entity_id: input_datetime.gang_hal_end_time
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.gang_hal_bezetting
                from: "on"
                to: "off"
          - action: input_datetime.set_datetime
            data:
              datetime: >
                {{ now() + timedelta(seconds=30) }}
            target:
              entity_id: input_datetime.gang_hal_end_time
    default:
      - action: light.turn_on
        data:
          brightness_pct: 100
        target:
          entity_id: light.gang_hal
      - delay:
          seconds: 30
      - action: input_datetime.set_datetime
        data:
          datetime: |
            {{ now() + timedelta(seconds=30) }}
        target:
          entity_id: input_datetime.gang_hal_end_time
