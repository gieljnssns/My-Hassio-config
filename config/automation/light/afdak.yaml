alias: Verlichting afdak
id: 960aa9bb-f469-49fd-8128-4c2e14b84563
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.afdak_deur
  - trigger: state
    entity_id: binary_sensor.afdak_pir
conditions:
  - condition: template
    value_template: >
      {{ as_timestamp(now()) - as_timestamp(states("sensor.uptime")) > 60 }}
  - condition: state
    entity_id: sensor.dark_outside
    state: "true"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.afdak_deur
            state: "on"
          - condition: state
            entity_id: binary_sensor.afdak_pir
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.afdak_verlichting
          - action: input_datetime.set_datetime
            data:
              datetime: >
                {{ now() + timedelta(seconds=180) }}
            target:
              entity_id: input_datetime.afdak_verlichting_end_time
          # - action: light.turn_off
          #   target:
          #     entity_id: light.afdak_verlichting
    default:
      - action: light.turn_on
        target:
          entity_id: light.afdak_verlichting
      - action: input_datetime.set_datetime
        data:
          datetime: >
            {{ now() + timedelta(seconds=60) }}
        target:
          entity_id: input_datetime.afdak_verlichting_end_time
      # - action: light.turn_off
      #   target:
      #     entity_id: light.afdak_verlichting
