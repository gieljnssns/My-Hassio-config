alias: Puschbutton leds sync
id: 2624a6a7-b817-41f3-bb22-904957508255
mode: parallel
triggers:
  - trigger: state
    entity_id: light.wc
  - trigger: state
    entity_id: light.waskot
  - trigger: state
    entity_id: light.badkamer_hoog
  - trigger: state
    entity_id: light.kelder
conditions:
  condition: and
  conditions:
    - condition: template
      value_template: >
        {{ as_timestamp(now()) - as_timestamp(states("sensor.uptime")) > 30 }}
actions:
  - action: >
      {% if trigger.to_state.state == 'on' %}
        switch.turn_on
      {% else %}
        switch.turn_off
      {% endif %}
    data_template:
      entity_id: >
        {% if trigger.entity_id == 'light.wc' %}
          switch.led_wc
        {% elif trigger.entity_id == 'light.waskot' %}
          switch.led_waskot
        {% elif trigger.entity_id == 'light.kelder' %}
          switch.led_kelder
        {% else %}
          switch.led_badkamer
        {% endif %}
