alias: "Bad weather notification - frost"
id: 177426d9-8cd4-47fa-852b-ba466e36bfb9
triggers:
  - trigger: time
    at: "07:00:00"

conditions:
  condition: and
  conditions:
    - condition: template
      value_template: >
        {{ states('sensor.buiten_temperatuur') | float(0) < 4
          and states('sensor.buiten_dauwpunt') | float(0) < 6
          and state_attr('weather.home_2', 'wind_speed') | float(0) < 12
          and state_attr('weather.home_2', 'cloud_coverage') | float(0) < 20
          and states('sensor.buiten_luchtvochtigheid') | float(0) > 50 }}

actions:
  - variables:
      direction: >
        {% set directions = [ 'N', 'NNO', 'NO', 'ONO', 'O', 'OZO', 'ZO', 'ZZO', 'Z', 'ZZW', 'ZW', 'WZW', 'W', 'WNW', 'NW', 'NNW', 'N'] -%}
        {% set idx = (state_attr("weather.home", "wind_bearing") | int(0) / 22.5) | round(0) | int -%}
        {{ directions[idx] }}
      fiets: >
        {% if direction in ["N", "NNO", "NO", "ONO", "O"] -%}
          , dus wind op kop.
        {% elif direction in ["Z", "ZZW", "ZW", "WZW", "W"] -%}
          , dus wind in de rug.
        {% else -%}
          , dus de wind staat niet goed of slecht.
        {% endif -%}
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.v_monnikenheide
            state: "on"
          - condition: state
            entity_id: binary_sensor.schooldag
            state: "on"
        sequence:
          - action: notify.mobile_app_mphone
            data:
              message: >
                " Er wordt ijzel voorspeld, op tijd vertrekken! Het is nu {{ states.sensor.buitentemperatuur_gefilterd.state_with_unit }}, {{ states("weather.home") }} en de wind waait {{ state_attr("weather.home_2", "wind_speed") }} {{ state_attr("weather.home_2", "wind_speed_unit") }} uit het {{ direction }} {{ fiets }} "
          - action: notify.noor_en_fien
            data:
              message: >
                " Er wordt ijzel voorspeld, op tijd vertrekken! Het is nu {{ states.sensor.buitentemperatuur_gefilterd.state_with_unit }}, {{ states("weather.home") }} en de wind waait {{ state_attr("weather.home_2", "wind_speed") }} {{ state_attr("weather.home_2", "wind_speed_unit") }} uit het {{ direction }} {{ fiets }} "
      - conditions:
          - condition: state
            entity_id: binary_sensor.v_monnikenheide
            state: "on"
          - condition: state
            entity_id: binary_sensor.schooldag
            state: "off"
        sequence:
          - action: notify.mobile_app_mphone
            data:
              message: >
                " Er wordt ijzel voorspeld, op tijd vertrekken! Het is nu {{ states.sensor.buitentemperatuur_gefilterd.state_with_unit }}, {{ states("weather.home") }} en de wind waait {{ state_attr("weather.home_2", "wind_speed") }} {{ state_attr("weather.home_2", "wind_speed_unit") }} uit het {{ direction }} {{ fiets }} "
      - conditions:
          - condition: state
            entity_id: binary_sensor.v_monnikenheide
            state: "off"
          - condition: state
            entity_id: binary_sensor.schooldag
            state: "on"
        sequence:
          - action: notify.noor_en_fien
            data:
              message: >
                " Er wordt ijzel voorspeld, op tijd vertrekken! Het is nu {{ states.sensor.buitentemperatuur_gefilterd.state_with_unit }}, {{ states("weather.home") }} en de wind waait {{ state_attr("weather.home_2", "wind_speed") }} {{ state_attr("weather.home_2", "wind_speed_unit") }} uit het {{ direction }} {{ fiets }} "
