alias: Boven sluiten
id: 55c6d9d1-872e-4244-8e7a-0551d34ab833
trigger:
  - trigger: state
    entity_id: binary_sensor.ramen_mogen_open
    from: "on"
    to: "off"
  - trigger: numeric_state
    entity_id: sensor.people_arrive_count
    above: 0
    for: "00:01:00"

condition:
  - condition: state
    entity_id: binary_sensor.ramen_mogen_open
    state: "off"
  - condition: template
    value_template: >
      {{
      is_state('binary_sensor.badkamer_raam_openen','on')
      or
      is_state('binary_sensor.slaapkamer_raam_openen','on')
      or
      is_state('binary_sensor.slaapkamer_fien_raam_openen','on')
      or
      is_state('binary_sensor.slaapkamer_noor_raam_openen','on')
      or
      is_state('binary_sensor.velux_openen','on')
      or
      is_state('binary_sensor.raam_openen','on')
      or
      is_state('binary_sensor.raam_openen_2','on')
      or
      is_state('binary_sensor.dubbel_raam_openen','on')
      }}

actions:
  - action: script.notify_everyone_at_home
    data:
      title: ☀️ Boven ramen sluiten
      message: >
        {% set list = [] -%}
        {% if is_state('binary_sensor.badkamer_raam_openen','on') -%}{% set list = list + ["Badkamer"] -%} {% endif -%}
        {% if is_state('binary_sensor.slaapkamer_raam_openen','on') -%}{% set list = list + ['Slaapkamer'] -%} {% endif -%}
        {% if is_state('binary_sensor.slaapkamer_fien_raam_openen','on') -%}{% set list = list + ["Slaapkamer Fien"] -%} {% endif -%}
        {% if is_state('binary_sensor.slaapkamer_noor_raam_openen','on') -%}{% set list = list + ["Slaapkamer Noor"] -%} {% endif -%}
        {% if is_state('binary_sensor.velux_openen','on') -%}{% set list = list + ["Slaapkamer velux"] -%} {% endif -%}
        {% if is_state('binary_sensor.raam_openen','on') -%}{% set list = list + ["Drumkot"] -%} {% endif -%}
        {% if is_state('binary_sensor.raam_openen_2','on') -%}{% set list = list + ["Gang raam"] -%} {% endif -%}
        {% if is_state('binary_sensor.dubbel_raam_openen','on') -%}{% set list = list + ["Gang dubbel raam"] -%} {% endif -%}
        Ramen gesloten moeten worden:
          {{ list | join(", ") }}
        Reden: {{ state_attr("binary_sensor.ramen_mogen_open", "reden") }}
