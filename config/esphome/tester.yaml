switch:
  - platform: gpio
    pin:
      number: D0
      inverted: yes
    name: "D0"
    id: pomp_vloerverwarming
    restore_mode: RESTORE_DEFAULT_OFF

  # - platform: gpio
  #   pin:
  #     number: D3
  #     # inverted: yes
  #   name: "Warm water extra"
  #   id: extra
  #   restore_mode: RESTORE_DEFAULT_OFF

  # - platform: gpio
  #   pin:
  #     number: D4
  #     # inverted: yes
  #   name: "Warm water snel"
  #   id: warm_water_snel
  #   on_turn_on:
  #     - delay: 500ms
  #     - switch.turn_off: warm_water_snel
