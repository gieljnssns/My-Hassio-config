  - platform: gpio
    pin:
      number: D5
      inverted: yes
    name: "D5"
    id: verwarming
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin:
      number: D6
      inverted: yes
    name: "D6"
    id: warm_water
    restore_mode: DISABLED
  
  - platform: gpio
    pin:
      number: D7
      inverted: yes
    name: "D7"
    id: verwarming2
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin:
      number: D8
      inverted: yes
    name: "D8"
    id: warm_water2
    restore_mode: DISABLED