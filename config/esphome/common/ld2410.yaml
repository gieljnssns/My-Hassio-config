text:
  - platform: template
    name: ${upper_devicename} moving trigger
    id: moving_trigger
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text
  
  - platform: template
    name: ${upper_devicename} still trigger
    id: still_trigger
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text

binary_sensor:
