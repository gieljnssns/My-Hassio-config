script:
  - id: check_all_zones_move
    # mode: queued
    mode: single
    then:
      - delay: !lambda "return id(timeout).state * 1000;"
      - lambda: |-
          ESP_LOGD("check_all_zones_move", "Start controle van bewegingsenergie in alle zones...");

          bool all_below_threshold = true;
          
          // Controleer of alle zones onder of gelijk aan de drempel zitten
          if (id(g0_move_energy).state >= id(g0_move_threshold).state) all_below_threshold = false;
          if (id(g1_move_energy).state >= id(g1_move_threshold).state) all_below_threshold = false;
          if (id(g2_move_energy).state >= id(g2_move_threshold).state) all_below_threshold = false;
          if (id(g3_move_energy).state >= id(g3_move_threshold).state) all_below_threshold = false;
          if (id(g4_move_energy).state >= id(g4_move_threshold).state) all_below_threshold = false;
          if (id(g5_move_energy).state >= id(g5_move_threshold).state) all_below_threshold = false;
          if (id(g6_move_energy).state >= id(g6_move_threshold).state) all_below_threshold = false;
          if (id(g7_move_energy).state >= id(g7_move_threshold).state) all_below_threshold = false;
          if (id(g8_move_energy).state >= id(g8_move_threshold).state) all_below_threshold = false;

          if (all_below_threshold) {
            id(move_binary).publish_state(false);
            ESP_LOGD("check_all_zones_move", "Alle zones onder drempel. move_binary = false");
          } else {
            ESP_LOGD("check_all_zones_move", "Minstens één zone boven drempel. move_binary blijft ongewijzigd.");
          }

          ESP_LOGD("check_all_zones_move", "Einde controle.");
  - id: check_all_zones_still
    # mode: queued
    mode: single
    then:
      - delay: !lambda "return id(timeout).state * 1000;"
      - lambda: |-
          ESP_LOGD("check_all_zones_still", "Start controle van still energy in alle zones...");

          bool all_below_threshold = true;
          
          // Controleer of alle zones onder of gelijk aan de drempel zitten
          if (id(g0_still_energy).state >= id(g0_still_threshold).state) all_below_threshold = false;
          if (id(g1_still_energy).state >= id(g1_still_threshold).state) all_below_threshold = false;
          if (id(g2_still_energy).state >= id(g2_still_threshold).state) all_below_threshold = false;
          if (id(g3_still_energy).state >= id(g3_still_threshold).state) all_below_threshold = false;
          if (id(g4_still_energy).state >= id(g4_still_threshold).state) all_below_threshold = false;
          if (id(g5_still_energy).state >= id(g5_still_threshold).state) all_below_threshold = false;
          if (id(g6_still_energy).state >= id(g6_still_threshold).state) all_below_threshold = false;
          if (id(g7_still_energy).state >= id(g7_still_threshold).state) all_below_threshold = false;
          if (id(g8_still_energy).state >= id(g8_still_threshold).state) all_below_threshold = false;

          if (all_below_threshold) {
            id(still_binary).publish_state(false);
            ESP_LOGD("check_all_zones_still", "Alle zones onder drempel. still_binary = false");
          } else {
            ESP_LOGD("check_all_zones_still", "Minstens één zone boven drempel. still_binary blijft ongewijzigd.");
          }

          ESP_LOGD("check_all_zones_still", "Einde controle.");
sensor:
  - platform: ld2410
    moving_distance:
      name: ${upper_devicename} Moving Distance
      id: moving_distance
    still_distance:
      name: ${upper_devicename} Still Distance
      id: still_distance
    moving_energy:
      name: ${upper_devicename} Move Energy
      id: moving_energy
    still_energy:
      name: ${upper_devicename} Still Energy
      id: still_energy
    detection_distance:
      name: ${upper_devicename} Detection Distance
      id: detection_distance

    # G0 t/m G8 zones
    g0:
      move_energy:
        name: ${upper_devicename} g0 move energy
        id: g0_move_energy
        on_value:
          lambda: |-
            if (x >= id(g0_move_threshold).state) {
              id(move_binary).publish_state(true);
              id(moving_trigger).publish_state("g0");
            }
            if (id(move_binary).state) {
              id(check_all_zones_move).execute();
              }
      still_energy:
