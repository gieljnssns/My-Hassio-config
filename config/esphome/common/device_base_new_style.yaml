esphome:
  name: ${devicename}


${platform}:
  board: ${board}

# Enable logging
logger:
  baud_rate: 0
  level: WARN

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret password

time:
  - platform: homeassistant
    id: homeassistant_time


binary_sensor:
  - platform: status
    id: connected
    name: "${upper_devicename} Status"


switch:
  - platform: restart
    name: ${upper_devicename} herstarten
    id: restart_device


button:
  - platform: safe_mode
    name: ${upper_devicename} Safe Mode Boot
    entity_category: diagnostic
