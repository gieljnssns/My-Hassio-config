sensor:
  - platform: bh1750
    name: "Buiten lichtsterkte"
    address: 0x23
    update_interval: 60s

  - platform: homeassistant
    entity_id: sensor.poort_luchtvochtigheid
    id: ha_humidity
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.buiten_temperatuur
    id: ha_temp
    internal: true

  - platform: bme280_i2c
    temperature:
      name: "Buiten temperatuur"
      id: bme280_temperature
      oversampling: 1x
    pressure:
      name: "Buiten luchtdruk"
      id: bme280_pressure
      oversampling: 1x

    address: 0x76
    i2c_id: bus_a
    update_interval: 60s

  - platform: template
    name: "Buiten dauwpunt"
    id: dauwpunt
    lambda: |-
      return (243.5*(log(id(ha_humidity).state/100)+((17.67*id(ha_temp).state)/
      (243.5+id(ha_temp).state)))/(17.67-log(id(ha_humidity).state/100)-
      ((17.67*id(ha_temp).state)/(243.5+id(ha_temp).state))));
    unit_of_measurement: °C
    icon: "mdi:thermometer-alert"
  
  - platform: absolute_humidity
    name: "${upper_devicename} absolute luchtvochtigheid"
    temperature: ha_temp
    humidity: ha_humidity
