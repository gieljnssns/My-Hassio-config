substitutions:
  devicename: buitenv2
  platform: esp8266
  board: nodemcuv2
  upper_devicename: Buiten

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device_base_new_style.yaml
  
i2c:
  sda: D2
  scl: D1
  scan: true
  id: bus_a

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 9600

switch:
  - platform: gpio
    pin:
      number: D5
    name: "Weerstation fan"
    # inverted: true
    id: fan
    restore_mode: RESTORE_DEFAULT_OFF

