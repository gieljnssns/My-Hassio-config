
substitutions:
  devicename: keuken
  upper_devicename: Keuken
  ssid: !secret ssid
  manual_ip: 192.168.79.161
  platform: esp32
  board: esp32dev

esp32:
  # board: esp32dev
  # framework:
  #   type: arduino
  framework:
    type: esp-idf

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device_base_new_style.yaml

captive_portal:
  
wifi:
  # ...
  power_save_mode: light

# esphome:
#   name: ${devicename}

esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: false

bluetooth_proxy:
  active: true

uart:
  tx_pin: 1
  rx_pin: 3
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

i2c:
  - id: bus_a
    sda: 21
    scl: 22
    scan: true
  # - id: bus_b
  #   sda: 14
  #   scl: 15
  #   scan: true

ld2410:

number:
  - platform: ld2410
    timeout:
      name: ${upper_devicename} timeout
      id: timeout
    max_move_distance_gate:
      name: ${upper_devicename} max_move_distance
    max_still_distance_gate:
      name: ${upper_devicename} max_still_distance
    g0:
      move_threshold:
        name: ${upper_devicename} g0 move
        mode: box
        id: g0_move_threshold
      still_threshold:
        name: ${upper_devicename} g0 still
        mode: box
        id: g0_still_threshold
    g1:
      move_threshold:
        name: ${upper_devicename} g1 move
        mode: box
        id: g1_move_threshold
      still_threshold:
        name: ${upper_devicename} g1 still
        mode: box
        id: g1_still_threshold
    g2:
      move_threshold:
        name: ${upper_devicename} g2 move
        mode: box
        id: g2_move_threshold
      still_threshold:
        name: ${upper_devicename} g2 still
        mode: box
        id: g2_still_threshold
    g3:
      move_threshold:
        name: ${upper_devicename} g3 move
        mode: box
        id: g3_move_threshold
      still_threshold:
        name: ${upper_devicename} g3 still
        mode: box
        id: g3_still_threshold
    g4:
      move_threshold:
        name: ${upper_devicename} g4 move
        mode: box
        id: g4_move_threshold
      still_threshold:
        name: ${upper_devicename} g4 still
        mode: box
        id: g4_still_threshold
    g5:
      move_threshold:
        name: ${upper_devicename} g5 move
        mode: box
        id: g5_move_threshold
      still_threshold:
        name: ${upper_devicename} g5 still
        mode: box
        id: g5_still_threshold
    g6:
      move_threshold:
        name: ${upper_devicename} g6 move
        mode: box
        id: g6_move_threshold
      still_threshold:
        name: ${upper_devicename} g6 still
        mode: box
        id: g6_still_threshold
    g7:
      move_threshold:
        name: ${upper_devicename} g7 move
        mode: box
        id: g7_move_threshold
      still_threshold:
        name: ${upper_devicename} g7 still
        mode: box
        id: g7_still_threshold
    g8:
      move_threshold:
        name: ${upper_devicename} g8 move
        mode: box
        id: g8_move_threshold
      still_threshold:
        name: ${upper_devicename} g8 still
        mode: box
        id: g8_still_threshold

switch:
  - platform: ld2410
    engineering_mode:
      name: ${upper_devicename} engineering mode
    bluetooth:
      name: ${upper_devicename} bluetooth

sensor:
  - platform: ld2410
    moving_distance:
      name: ${upper_devicename} Moving Distance
      id: moving_distance
    still_distance:
      name: ${upper_devicename} Still Distance
      id: still_distance
    moving_energy:
      name: ${upper_devicename} Move Energy
      id: moving_energy
    still_energy:
      name: ${upper_devicename} Still Energy
      id: still_energy
    detection_distance:
      name: ${upper_devicename} Detection Distance
      id: detection_distance

    g0:
      move_energy:
        name: ${upper_devicename} g0 move energy
        id: g0_move_energy
      still_energy:
        name: ${upper_devicename} g0 still energy
        id: g0_still_energy
    g1:
      move_energy:
        name: ${upper_devicename} g1 move energy
        id: g1_move_energy
      still_energy:
        name: ${upper_devicename} g1 still energy
        id: g1_still_energy
    g2:
      move_energy:
        name: ${upper_devicename} g2 move energy
        id: g2_move_energy
      still_energy:
        name: ${upper_devicename} g2 still energy
        id: g2_still_energy
    g3:
      move_energy:
        name: ${upper_devicename} g3 move energy
        id: g3_move_energy
      still_energy:
        name: ${upper_devicename} g3 still energy
        id: g3_still_energy
    g4:
      move_energy:
        name: ${upper_devicename} g4 move energy
        id: g4_move_energy
      still_energy:
        name: ${upper_devicename} g4 still energy
        id: g4_still_energy
    g5:
      move_energy:
        name: ${upper_devicename} g5 move energy
        id: g5_move_energy
      still_energy:
        name: ${upper_devicename} g5 still energy
        id: g5_still_energy
    g6:
      move_energy:
        name: ${upper_devicename} g6 move energy
        id: g6_move_energy
      still_energy:
        name: ${upper_devicename} g6 still energy
        id: g6_still_energy
    g7:
      move_energy:
        name: ${upper_devicename} g7 move energy
        id: g7_move_energy
      still_energy:
        name: ${upper_devicename} g7 still energy
        id: g7_still_energy
    g8:
      move_energy:
        name: ${upper_devicename} g8 move energy
        id: g8_move_energy
      still_energy:
        name: ${upper_devicename} g8 still energy
        id: g8_still_energy


  - platform: bme280_i2c
    temperature:
      name: "${upper_devicename} temperatuur"
      id: bme280_temperature
      oversampling: 1x
    humidity:
      name: "${upper_devicename} luchtvochtigheid"
      id: bme280_humidity
      oversampling: 1x
    address: 0x76
    i2c_id: bus_a
    update_interval: 60s

text:
  - platform: template
    name: ${upper_devicename} moving trigger
    id: moving_trigger
    # optimistic: true
    min_length: 0
    max_length: 100
    mode: text
  
  - platform: template
    name: ${upper_devicename} still trigger
    id: still_trigger
    # optimistic: true
    min_length: 0
    max_length: 100
    mode: text

binary_sensor:
  - platform: ld2410
    has_target:
      name: ${upper_devicename} Presence
    has_moving_target:
      name: ${upper_devicename} Moving Target
    has_still_target:
      name: ${upper_devicename} Still Target
  
  - platform: template
    name: ${upper_devicename} pir delay
    device_class: motion
    lambda: |-
      if (id(pir).state) {
        return true;
      } else {
        return false;
      }
    filters:
      - delayed_off: 60s

  - platform: gpio
    pin: GPIO19
    name: ${upper_devicename} pir
    id: pir
    device_class: motion

  - platform: template
    name: ${upper_devicename} Moving
    id: moving
    device_class: motion
    lambda: |-
      if (id(g0_move_energy).state > id(g0_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G0 Move");
        call.perform();
      } 
      if (id(g1_move_energy).state > id(g1_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G1 Move");
        call.perform();
      }
      if (id(g2_move_energy).state > id(g2_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G2 Move");
        call.perform();
      }
      if (id(g3_move_energy).state > id(g3_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G3 Move");
        call.perform();
      }
      if (id(g4_move_energy).state > id(g4_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G4 Move");
        call.perform();
      }
      if (id(g5_move_energy).state > id(g5_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G5 Move");
        call.perform();
      }
      if (id(g6_move_energy).state > id(g6_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G6 Move");
        call.perform();
      }
      if (id(g7_move_energy).state > id(g7_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G7 Move");
        call.perform();
      }
      if (id(g8_move_energy).state > id(g8_move_threshold).state) {
        return true;
        auto call = id(moving_trigger).make_call();
        call.set_value("G8 Move");
        call.perform();
      }

  - platform: template
    name: ${upper_devicename} Still
    id: still
    device_class: motion
    lambda: |-
      if (id(g0_still_energy).state > id(g0_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G0 Still");
        call.perform();
      }
      if (id(g1_still_energy).state > id(g1_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G1 Still");
        call.perform();
      }
      if (id(g2_still_energy).state > id(g2_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G2 Still");
        call.perform();
      }
      if (id(g3_still_energy).state > id(g3_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G3 Still");
        call.perform();
      }
      if (id(g4_still_energy).state > id(g4_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G4 Still");
        call.perform();
      }
      if (id(g5_still_energy).state > id(g5_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G5 Still");
        call.perform();
      }
      if (id(g6_still_energy).state > id(g6_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G6 Still");
        call.perform();
      }
      if (id(g7_still_energy).state > id(g7_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G7 Still");
        call.perform();
      }
      if (id(g8_still_energy).state > id(g8_still_threshold).state) {
        return true;
        auto call = id(still_trigger).make_call();
        call.set_value("G8 Still");
        call.perform();
      }
  
  - platform: template
    name: ${upper_devicename} occupancy
    device_class: occupancy
    lambda: |-
      if (id(moving).state) {
        return true;
      if (id(still).state) {
        return true;
      } else {
        return false;
      }
    filters:
      - delayed_off: !lambda |-
          return id(timeout).state