# https://docs.cirkitdesigner.com/component/bf83b676-1f1f-45a8-a073-eda11fe8155a/module-ethernet-w5500

substitutions:
  devicename: luchtdroger
  upper_devicename: Luchtdroger
  platform: esp32
  board: esp32dev

esp32:
  framework:
    type: esp-idf

packages:
  device_base: !include common/device_base_new_style.yaml

ethernet:
  type: W5500
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  cs_pin: GPIO33
  interrupt_pin: GPIO25

logger:
  level: DEBUG

i2c:
  - id: bus_a
    sda: 21
    scl: 22
    scan: true
    frequency: 800khz
    timeout: 20ms
  # - id: bus_b
  #   sda: 14
  #   scl: 15
  # - id: bus_c
  #   sda: 26
  #   scl: 27
  #   # scan: true
  #   frequency: 800khz
  #   timeout: 20ms

switch:
  - platform: gpio
    pin:
      number: 32
      inverted: yes
    name: ${upper_devicename}
    id: luchtdroger
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin:
      number: 16
      inverted: yes
    name: Verluchting
    id: ventilator
    restore_mode: RESTORE_DEFAULT_OFF
    # on_turn_on:
    #   then:
    #     - lambda: |-
    #         if (id(condensatie_marge_keuken).state < 2) {
    #           id(luchtdroger).turn_on();
    #         }
    #         if (id(condensatie_marge_slaapkamer).state < 2) {
    #           id(luchtdroger).turn_on();
    #         }
    #         if (id(condensatie_marge_noor).state < 2) {
    #           id(luchtdroger).turn_on();
    #         }
    #         if (id(condensatie_marge_fien).state < 2) {
    #           id(luchtdroger).turn_on();
    #         }
    #         if ((id(living_luchtvochtigheid).state > 59) && (id(beneden_temperatuur).state < 19)) {
    #           id(luchtdroger).turn_on();
    #         }
    #         if ((id(ha_temp).state > -7) && (id(ha_temp).state < 32) && (id(living_absolute_luchtvochtigheid).state < id(buiten_absolute_luchtvochtigheid).state) && (id(beneden_temperatuur).state < 19)) {
    #           id(luchtdroger).turn_on();
    #         } 
    #         if ((id(ha_temp).state > -7) && (id(ha_temp).state < 7)) {
    #           id(luchtdroger).turn_on();
    #         }
    on_turn_off:
      then:
        - switch.turn_off: luchtdroger

  - platform: gpio
    pin:
      number: 4
      inverted: yes
    internal: true
    id: reserve
    restore_mode: RESTORE_DEFAULT_OFF

interval:
  - interval: 5min
    then:
      - lambda: |-
          // Luchtdroger mag hoe dan ook nooit draaien zonder ventilator
          if (!id(ventilator).state) {
            if (id(luchtdroger).state) {
              id(luchtdroger).turn_off();
            }
            return;
          }

          bool moet_aan = false;

          if (id(condensatie_marge_keuken).state < 2)      moet_aan = true;
          if (id(condensatie_marge_slaapkamer).state < 2)  moet_aan = true;
          if (id(condensatie_marge_noor).state < 2)        moet_aan = true;
          if (id(condensatie_marge_fien).state < 2)        moet_aan = true;

          if ((id(living_luchtvochtigheid).state > 59) &&
              (id(beneden_temperatuur).state < 19)) {
            moet_aan = true;
          }

          if ((id(ha_temp).state > -7) && (id(ha_temp).state < 32) &&
              (id(living_absolute_luchtvochtigheid).state < id(buiten_absolute_luchtvochtigheid).state) &&
              (id(beneden_temperatuur).state < 19)) {
            moet_aan = true;
          }

          if (moet_aan) {
            if (!id(luchtdroger).state) id(luchtdroger).turn_on();
          } else {
            if (id(luchtdroger).state) id(luchtdroger).turn_off();
          }

sensor:
  - platform: sht3xd
    temperature:
      name: ${upper_devicename} uitgaande temperatuur
      id: air_temperature
      # internal: true
    humidity:
      name: ${upper_devicename} uitgaande luchtvochtigheid
      id: relative_humidity
    # address: 0x44
    update_interval: 60s
    i2c_id: bus_a

  # - platform: sht3xd
  #   temperature:
  #     name: ${upper_devicename} ingaande temperatuur
  #     id: temp_in
  #     # on_value_range:
  #     #   - below: 3.0
  #     #     then:
  #     #       - switch.turn_off: luchtdroger
  #     # internal: true
  #   humidity:
  #     name: ${upper_devicename} ingaande luchtvochtigheid
  #     # internal: true
  #   address: 0x44
  #   update_interval: 60s
  #   i2c_id: bus_c
  - platform: absolute_humidity
    name: ${upper_devicename} uitgaande absolute luchtvochtigheid
    temperature: air_temperature
    humidity: relative_humidity

  - platform: homeassistant
    entity_id: sensor.beneden_absolute_luchtvochtigheid
    id: living_absolute_luchtvochtigheid
    internal: true

  - platform: homeassistant
    entity_id: sensor.buiten_absolute_luchtvochtigheid
    id: buiten_absolute_luchtvochtigheid
    internal: true

  - platform: homeassistant
    entity_id: sensor.buiten_temperatuur
    id: ha_temp
    internal: true

  - platform: homeassistant
    entity_id: sensor.living_luchtvochtigheid
    id: living_luchtvochtigheid
    internal: true

  - platform: homeassistant
    entity_id: sensor.gemiddelde_temp_beneden
    id: beneden_temperatuur
    internal: true

  - platform: homeassistant
    entity_id: sensor.condensatie_marge_keuken
    id: condensatie_marge_keuken
    internal: true

  - platform: homeassistant
    entity_id: sensor.condensatie_marge_slaapkamer
    id: condensatie_marge_slaapkamer
    internal: true

  - platform: homeassistant
    entity_id: sensor.condensatie_marge_noor
    id: condensatie_marge_noor
    internal: true

  - platform: homeassistant
    entity_id: sensor.condensatie_marge_fien
    id: condensatie_marge_fien
    internal: true
