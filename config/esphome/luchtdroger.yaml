

# https://docs.cirkitdesigner.com/component/bf83b676-1f1f-45a8-a073-eda11fe8155a/module-ethernet-w5500

substitutions:
  devicename: luchtdroger
  upper_devicename: Luchtdroger
  platform: esp32
  board: esp32dev

esp32:
  framework:
    type: esp-idf

packages:
  device_base: !include common/device_base_new_style.yaml

ethernet:
  type: W5500
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
  cs_pin: GPIO33
  interrupt_pin: GPIO25

logger:
  level: DEBUG

i2c:
  - id: bus_a
    sda: 21
    scl: 22
    scan: true
    frequency: 800khz
    timeout: 20ms
  # - id: bus_b
  #   sda: 14
  #   scl: 15
  # - id: bus_c
  #   sda: 26
  #   scl: 27
  #   # scan: true
  #   frequency: 800khz
  #   timeout: 20ms

switch:
  - platform: gpio
    pin:
      number: 32
      # number: 16
      inverted: yes
    name: ${upper_devicename}
    id: luchtdroger
    restore_mode: RESTORE_DEFAULT_OFF

  # - platform: gpio
  #   pin:
  #     # number: 33
  #     number: 17
  #     # inverted: yes
  #   #internal: true
  #   name: low
  #   id: low
  #   restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin:
      # number: 25
      number: 16
      inverted: yes
    # internal: true
    name: Verluchting
    id: ventilator
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on: 
      then:
        - lambda: |-
            if (id(condensatie_marge_keuken).state < 3) {
              id(luchtdroger).turn_on();
            }
            if (id(condensatie_marge_slaapkamer).state < 3) {
              id(luchtdroger).turn_on();
            }
            if (id(condensatie_marge_noor).state < 3) {
              id(luchtdroger).turn_on();
            }
            if (id(condensatie_marge_fien).state < 3) {
              id(luchtdroger).turn_on();
            }
            if ((id(living_luchtvochtigheid).state > 59) && (id(beneden_temperatuur).state < 19)) {
              id(luchtdroger).turn_on();
            }
            if ((id(ha_temp).state > -7) && (id(ha_temp).state < 32) && (id(living_absolute_luchtvochtigheid).state < id(buiten_absolute_luchtvochtigheid).state) && (id(beneden_temperatuur).state < 19)) {
              id(luchtdroger).turn_on();
            } 
            if ((id(ha_temp).state > -7) && (id(ha_temp).state < 7)) {
              id(luchtdroger).turn_on();
            } 
        # - lambda: |-
        #     if ((id(living_luchtvochtigheid).state > 59) && (id(living_temperatuur).state < 21)) {
        #       id(luchtdroger).turn_on();
        #     }
        #     if ((id(temp_in).state > 1) && (id(ha_temp).state < 32) && (id(living_absolute_luchtvochtigheid).state > id(buiten_absolute_luchtvochtigheid).state) && (id(living_temperatuur).state < 21)) {
        #       id(luchtdroger).turn_on();
        #     } 
    
    on_turn_off: 
      then:
        - switch.turn_off: luchtdroger

  - platform: gpio
    pin:
      # number: 19
      number: 4
      inverted: yes
    internal: true
    id: reserve
    restore_mode: RESTORE_DEFAULT_OFF

