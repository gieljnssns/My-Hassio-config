sensor:
    
  - platform: sht3xd
    temperature:
      name: ${upper_devicename} uitgaande temperatuur
      id: air_temperature
      # internal: true
    humidity:
      name: ${upper_devicename} uitgaande luchtvochtigheid
      id: relative_humidity
    # address: 0x44
    update_interval: 60s
    i2c_id: bus_a

  # - platform: sht3xd
  #   temperature:
  #     name: ${upper_devicename} ingaande temperatuur
  #     id: temp_in
  #     # on_value_range:
  #     #   - below: 3.0
  #     #     then:
  #     #       - switch.turn_off: luchtdroger
  #     # internal: true
  #   humidity:
  #     name: ${upper_devicename} ingaande luchtvochtigheid
  #     # internal: true
  #   address: 0x44
  #   update_interval: 60s
  #   i2c_id: bus_c
  - platform: absolute_humidity
    name: ${upper_devicename} uitgaande absolute luchtvochtigheid
    temperature: air_temperature
    humidity: relative_humidity

  - platform: homeassistant
    entity_id: sensor.living_absolute_luchtvochtigheid
    id: living_absolute_luchtvochtigheid
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.buiten_absolute_luchtvochtigheid
    id: buiten_absolute_luchtvochtigheid
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.buiten_temperatuur
    id: ha_temp
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.living_luchtvochtigheid
    id: living_luchtvochtigheid
    internal: true

  - platform: homeassistant
    entity_id: sensor.gemiddelde_temp_beneden
    id: beneden_temperatuur
    internal: true
  

  - platform: homeassistant
    entity_id: sensor.condensatie_marge_keuken
    id: condensatie_marge_keuken
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.condensatie_marge_slaapkamer
    id: condensatie_marge_slaapkamer
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.condensatie_marge_noor
    id: condensatie_marge_noor
    internal: true

  - platform: homeassistant
    entity_id: sensor.condensatie_marge_fien
    id: condensatie_marge_fien
    internal: true

