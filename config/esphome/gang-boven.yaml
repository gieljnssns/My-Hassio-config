esp32:
  framework:
    type: esp-idf
    advanced: 
      minimum_chip_revision: "3.1"
    # version: 5.4.1
  # variant: esp32

# esphome:
#   on_boot:
#     - priority: 1001
#       then:
#         - lambda: |-
#             gpio_reset_pin((gpio_num_t)01);
#             gpio_reset_pin((gpio_num_t)03);

packages:
  wifi: !include common/wifi.yaml
  device_base: !include common/device_base_new_style.yaml
  
wifi:
  # ...
  power_save_mode: light

logger:
  baud_rate: 0
  level: DEBUG

esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: false

bluetooth_proxy:
  active: true

# uart:
#   # id: uart_0
#   tx_pin: GPIO1
#   # tx_pin: TX1
#   rx_pin: 
#     number: GPIO3
#     mode:
#       pullup: true
#       input: true
#   baud_rate: 128000
#   stop_bits: 1
#   data_bits: 8
#   parity: NONE
#   rx_full_threshold: 23
#   debug:
#     direction: BOTH
#     dummy_receiver: true
#     after:
#       delimiter: "\n"
#     sequence:
#       - lambda: UARTDebug::log_hex(direction, bytes, 32);
uart:
  tx_pin: TX
  rx_pin: 
    number: RX
    mode:
      input: true
      pullup: true
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
