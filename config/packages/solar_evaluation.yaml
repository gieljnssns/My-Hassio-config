# ===== HELPER ENTITIES =====
# Voeg toe aan configuration.yaml

input_text:
  best_solar_predictor_interpolated:
    name: "Beste Solar Voorspeller (5m)"
    max: 50

  evaluation_log_interpolated:
    name: "Evaluatie Log (5m)"
    max: 255

input_number:
  solcast_interp_mse:
    name: "Solcast MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast10_interp_mse:
    name: "Solcast 10% MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast90_interp_mse:
    name: "Solcast 90% MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  openmeteo_interp_mse:
    name: "OpenMeteo MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast_interp_mae:
    name: "Solcast MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast10_interp_mae:
    name: "Solcast 10% MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast90_interp_mae:
    name: "Solcast 90% MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  openmeteo_interp_mae:
    name: "OpenMeteo MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

input_datetime:
  last_evaluation_time_interpolated:
    name: "Laatste Evaluatie Tijd (5m)"
    has_date: true
    has_time: true

input_boolean:
  solar_evaluation_active:
    name: "Solar Evaluatie Actief"
    initial: true

# ===== TEMPLATE SENSORS =====
template:
  - sensor:
      # Huidige beste voorspeller voor gebruik
      - name: "Current Best Solar Predictor"
        unique_id: 23308df6-7a7b-4393-978d-c2c475a2f00d
        state: >
          {{ states('input_text.best_solar_predictor_interpolated') }}
  - binary_sensor:
      # Check of we in evaluatie periode zitten
      - name: "Solar Evaluation Period"
        unique_id: 73557d94-39a4-4ab7-b125-2e30652045a0
        state: >
          {% set sunrise_today = state_attr('sun.sun', 'next_rising') | as_datetime -%}
          {% if sunrise_today.date() != now().date() -%}
            {% set sunrise_today = sunrise_today - timedelta(days=1) -%}
          {% endif -%}
          {% set sunset_today = state_attr('sun.sun', 'next_setting') | as_datetime -%}
          {% if sunset_today.date() != now().date() -%}
            {% set sunset_today = sunset_today - timedelta(days=1) -%}
          {% endif -%}
          {% set now_time = now() -%}
          {% set evaluation_start = sunrise_today + timedelta(hours=1) -%}
          {% if evaluation_start <= now_time <= sunset_today -%}
            true
          {% else -%}
            false
          {% endif -%}

# ===== AUTOMATIONS =====
automation:
  # Set beste voorspeller op basis van voorspelde verwarmingsuren
  - alias: "Set Solar Predictor"
    description: "Set beste voorspeller op basis van voorspelde verwarmingsuren"
    id: b490ff5c-f359-47a9-92af-2420e21e38c1
    triggers:
      - trigger: time
        at: "00:30:00"
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.best_solar_predictor_interpolated
        data:
          value: >
            {% set uren = states('sensor.warmtepomp_uren') | float(0) -%}
            {% if uren >= 4 -%}
              solcast10
            {% elif uren >= 2 -%}
              solcast
            {% else -%}
              solcast90
            {% endif -%}

  - alias: "Hourly Solar Prediction Evaluation (5m)"
    description: "Evalueer uurlijks welke 5m-voorspelling het beste presteert"
    id: 54877c8c-46d8-4c01-a220-6f28f05a0cce
    triggers:
      - trigger: time_pattern
        minutes: 59
    conditions:
      - condition: state
        entity_id: input_boolean.solar_evaluation_active
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.solar_evaluation_period', 'on') }}
    actions:
      - action: recorder.get_statistics
        data:
          start_time: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
          end_time: "{{ now() }}"
          statistic_ids:
            - sensor.huidige_opbrengst_gefilterd
          period: 5minute
          types:
            - mean
        response_variable: daily_stats_interpolated

      - action: python_script.precise_solar_evaluation_interpolated
        data:
          statistics_data: "{{ daily_stats_interpolated }}"
          current_time: "{{ now().isoformat() }}"

  # Notificatie bij wijziging beste voorspeller
  - alias: "Solar Predictor Changed Notification"
    description: "Stuur notificatie als beste voorspeller wijzigt"
    id: 0860fc90-a420-4fe3-97c8-5819100f2e6c
    triggers:
      - trigger: state
        entity_id: input_text.best_solar_predictor_interpolated
    conditions:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      - action: notify.mobile_app_gphone # Pas aan naar je notificatie service
        data:
          title: "🌞 Solar Voorspeller Gewijzigd"
          message: >
            Beste voorspeller is gewijzigd van
            {{ trigger.from_state.state }} naar {{ trigger.to_state.state }}.
            Huidige scores:
            - Solcast: MSE {{ states('input_number.solcast_interp_mse') | round(2) }}
            - Solcast 10%: MSE {{ states('input_number.solcast10_interp_mse') | round(2) }}
            - Solcast 90%: MSE {{ states('input_number.solcast90_interp_mse') | round(2) }}
            - OpenMeteo: MSE {{ states('input_number.openmeteo_interp_mse') | round(2) }}
