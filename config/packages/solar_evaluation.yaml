# ===== HELPER ENTITIES =====
# Voeg toe aan configuration.yaml

input_text:
  best_solar_predictor_interpolated:
    name: "Beste Solar Voorspeller (5m)"
    max: 50

  evaluation_log_interpolated:
    name: "Evaluatie Log (5m)"
    max: 255

input_number:
  solcast_interp_mse:
    name: "Solcast MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast10_interp_mse:
    name: "Solcast 10% MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast90_interp_mse:
    name: "Solcast 90% MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  openmeteo_interp_mse:
    name: "OpenMeteo MSE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast_interp_mae:
    name: "Solcast MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast10_interp_mae:
    name: "Solcast 10% MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  solcast90_interp_mae:
    name: "Solcast 90% MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

  openmeteo_interp_mae:
    name: "OpenMeteo MAE (5m)"
    min: 0
    max: 10000000
    step: 0.01
    mode: box

input_datetime:
  last_evaluation_time_interpolated:
    name: "Laatste Evaluatie Tijd (5m)"
    has_date: true
    has_time: true

input_boolean:
  solar_evaluation_active:
    name: "Solar Evaluatie Actief"
    initial: true

# ===== TEMPLATE SENSORS =====
template:
  - sensor:
      # Huidige beste voorspeller voor gebruik
      - name: "Current Best Solar Predictor"
        unique_id: 23308df6-7a7b-4393-978d-c2c475a2f00d
        state: >
          {{ states('input_text.best_solar_predictor_interpolated') }}
  - binary_sensor:
      # Check of we in evaluatie periode zitten
      - name: "Solar Evaluation Period"
        unique_id: 73557d94-39a4-4ab7-b125-2e30652045a0
        state: >
          {% set sunrise_today = state_attr('sun.sun', 'next_rising') | as_datetime -%}
          {% if sunrise_today.date() != now().date() -%}
            {% set sunrise_today = sunrise_today - timedelta(days=1) -%}
          {% endif -%}
          {% set sunset_today = state_attr('sun.sun', 'next_setting') | as_datetime -%}
          {% if sunset_today.date() != now().date() -%}
            {% set sunset_today = sunset_today - timedelta(days=1) -%}
          {% endif -%}
          {% set now_time = now() -%}
          {% set evaluation_start = sunrise_today + timedelta(hours=1) -%}
          {% if evaluation_start <= now_time <= sunset_today -%}
            true
          {% else -%}
            false
          {% endif -%}

      


