  - alias: "Hourly Solar Prediction Evaluation (5m)"
    description: "Evalueer uurlijks welke 5m-voorspelling het beste presteert"
    id: 54877c8c-46d8-4c01-a220-6f28f05a0cce
    trigger:
      - platform: time_pattern
        minutes: 59
    condition:
      - condition: state
        entity_id: input_boolean.solar_evaluation_active
        state: 'on'
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.solar_evaluation_period', 'on') }}
    action:
      - service: recorder.get_statistics
        data:
          start_time: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
          end_time: "{{ now() }}"
          statistic_ids:
            - sensor.huidige_opbrengst_gefilterd
          period: 5minute
          types:
            - mean
        response_variable: daily_stats_interpolated

      - service: python_script.precise_solar_evaluation_interpolated
        data:
          statistics_data: "{{ daily_stats_interpolated }}"
          current_time: "{{ now().isoformat() }}"

  # Notificatie bij wijziging beste voorspeller
  - alias: "Solar Predictor Changed Notification"
    description: "Stuur notificatie als beste voorspeller wijzigt"
    id: 0860fc90-a420-4fe3-97c8-5819100f2e6c
    trigger:
      - platform: state
        entity_id: input_text.best_solar_predictor_interpolated
    condition:
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      - condition: template
        value_template: "{{ trigger.from_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - service: notify.mobile_app_gphone  # Pas aan naar je notificatie service
        data:
          title: "🌞 Solar Voorspeller Gewijzigd"
          message: >
            Beste voorspeller is gewijzigd van
            {{ trigger.from_state.state }} naar {{ trigger.to_state.state }}.
            Huidige scores:
            - Solcast: MSE {{ states('input_number.solcast_interp_mse') | round(2) }}
            - Solcast 10%: MSE {{ states('input_number.solcast10_interp_mse') | round(2) }}  
            - Solcast 90%: MSE {{ states('input_number.solcast90_interp_mse') | round(2) }}
            - OpenMeteo: MSE {{ states('input_number.openmeteo_interp_mse') | round(2) }}

