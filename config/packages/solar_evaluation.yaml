# ===== HELPER ENTITIES =====
input_text:
  best_solar_predictor_interpolated:
    name: "Beste Solar Voorspeller (5m)"
    max: 50

input_boolean:
  solar_evaluation_active:
    name: "Solar Evaluatie Actief"
    initial: true

# ===== TEMPLATE SENSORS =====
template:
  - sensor:
      # Huidige beste voorspeller voor gebruik
      - name: "Current Best Solar Predictor"
        unique_id: 23308df6-7a7b-4393-978d-c2c475a2f00d
        state: >
          {{ states('input_text.best_solar_predictor_interpolated') }}
  - binary_sensor:
      # Check of we in evaluatie periode zitten
      - name: "Solar Evaluation Period"
        unique_id: 73557d94-39a4-4ab7-b125-2e30652045a0
        state: >
          {% set sunrise_today = state_attr('sun.sun', 'next_rising') | as_datetime -%}
          {% if sunrise_today.date() != now().date() -%}
            {% set sunrise_today = sunrise_today - timedelta(days=1) -%}
          {% endif -%}
          {% set sunset_today = state_attr('sun.sun', 'next_setting') | as_datetime -%}
          {% if sunset_today.date() != now().date() -%}
            {% set sunset_today = sunset_today - timedelta(days=1) -%}
          {% endif -%}
          {% set now_time = now() -%}
          {% set evaluation_start = sunrise_today + timedelta(hours=1) -%}
          {% if evaluation_start <= now_time <= sunset_today -%}
            true
          {% else -%}
            false
          {% endif -%}

# ===== AUTOMATIONS =====
automation:
  - alias: "Hourly Solar Prediction Evaluation (5m)"
    description: "Evalueer uurlijks welke 5m-voorspelling het beste presteert"
    id: 54877c8c-46d8-4c01-a220-6f28f05a0cce
    triggers:
      - trigger: time_pattern
        minutes: 59
      - trigger: time_pattern
        minutes: 29
    conditions:
      - condition: state
        entity_id: input_boolean.solar_evaluation_active
        state: "on"
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.solar_evaluation_period', 'on') }}
    actions:
      - action: recorder.get_statistics
        data:
          start_time: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
          end_time: "{{ now() }}"
          statistic_ids:
            - sensor.huidige_opbrengst_gefilterd
          period: 5minute
          types:
            - mean
        response_variable: daily_stats_interpolated

      - action: python_script.precise_solar_evaluation_interpolated
        data:
          statistics_data: "{{ daily_stats_interpolated }}"
          current_time: "{{ now().isoformat() }}"

