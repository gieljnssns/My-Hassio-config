# Voeg dit toe aan je configuration.yaml
# (of in sensors.yaml als je includes gebruikt)

input_number:
  loss_per_k:
    name: Warmteverlies per graad
    min: 50
    max: 1000
    step: 10
    unit_of_measurement: "W/K"
    mode: box
    icon: mdi:fire

template:
  - sensor:
      - name: "Delta Temperatuur"
        unique_id: 0df77cd5-2081-4e08-be0c-1e3bd8d4d8e2
        unit_of_measurement: "°C"
        state: >
          {{ (states('sensor.gemiddelde_temp_beneden') | float - 
              states('sensor.buiten_temperatuur') | float) | round(2) }}

      - name: "Warmtepomp thermisch vermogen"
        unique_id: 3a4c3fa7-b4de-4f7a-8ea2-7309edd110df
        unit_of_measurement: "W"
        state: >
          {% set p = states('sensor.warmtepomp_huidig_verbruik') | float(0) %}
          {{ (p * 4.66) | round(0) }}

      - name: "WP benodigd vermogen"
        unique_id: e4324ca6-6632-4d03-8cc0-d7f915571610
        unit_of_measurement: "W"
        state: >
          {% set Tin = 21 %}  {# gewenste binnentemp, pas aan #}
          {% set Tout = states('sensor.buiten_temperatuur') | float(0) %}
          {% set loss = states('input_number.loss_per_k') | float(300) %}
          {% set Pneed = (Tin - Tout) * loss %}
          {{ [Pneed, 0] | max | round(0) }}

      - name: "WP runtime per uur"
        unique_id: 0c5a439f-1a4c-450a-b021-47bfb806ee3c
        unit_of_measurement: "min"
        state: >
          {% set Pwp = states('sensor.warmtepomp_thermisch_vermogen') | float(0) %}
          {% set Pneed = states('sensor.wp_benodigd_vermogen') | float(0) %}
          {% if Pwp > 0 %}
            {{ (60 * Pneed / Pwp) | round(1) }}
          {% else %}
            unknown
          {% endif %}
      
      - name: "Warmteverlies Coefficient"
        unique_id: c9e82539-95ec-4039-b0b7-b96b493c09a6\
        unit_of_measurement: "W/K"
        state: >
          {% set delta_t = states('sensor.delta_temperatuur') | float %}
          {% set thermal_power = states('sensor.warmtepomp_thermisch_vermogen') | float %}
          {% if delta_t > 0 and thermal_power > 0 %}
            {{ (thermal_power / delta_t) | round(2) }}
          {% else %}
            0
          {% endif %}
        
      # Vloerverwarming deltaT (heen - terug)
      - name: "Vloerverwarming Delta T"
        unique_id: a5e1de95-bc5f-4989-bf53-274fb0d73764
        unit_of_measurement: "°C"
        state: >
          {{ (states('sensor.vloerverwarming_heen') | float - 
              states('sensor.vloerverwarming_terug') | float) | round(2) }}
        
      # # Temperatuur stijgingssnelheid (°C per uur)
      # - name: "Temperatuur Stijging"
      #   unique_id: db815983-96ed-41b5-8246-849c38724773
      #   unit_of_measurement: "°C/h"
      #   state: >
      #     {% set current_temp = states('sensor.gemiddelde_temp_beneden') | float %}
      #     {% set prev_temp = state_attr('sensor.temperatuur_stijging', 'previous_temp') | default(current_temp) | float %}
      #     {% set time_diff = (now().timestamp() - state_attr('sensor.temperatuur_stijging', 'last_update') | default(now().timestamp()) | float) / 3600 %}
      #     {% if time_diff > 0 %}
      #       {{ ((current_temp - prev_temp) / time_diff) | round(4) }}
      #     {% else %}
      #       0
      #     {% endif %}
      #   attributes:
      #     previous_temp: "{{ states('sensor.gemiddelde_temp_beneden') | float }}"
      #     last_update: "{{ now().timestamp() }}"

automation:
  - alias: Bereken warmteverlies per graad
    id: 68f87771-8e84-46b4-9061-d50b303be9ba
    trigger:
      - platform: time
        at: "03:30:00"   # elke nacht om 3:30u
    action:
      - service: recorder.get_statistics
        data:
          start_time: "{{ now().replace(hour=0, minute=0, second=0).isoformat() }}"
          end_time: "{{ now().isoformat() }}"
          period: 5minute
          types:
            - mean
          statistic_ids:
            - sensor.gemiddelde_temp_beneden
            - sensor.buiten_temperatuur
            - sensor.warmtepomp_huidig_verbruik
        response_variable: stats
      - variables:
          Tin: "{{ stats.statistics['sensor.gemiddelde_temp_beneden'][-1].mean }}"
          Tout: "{{ stats.statistics['sensor.buiten_temperatuur'][-1].mean }}"
          Pelec: "{{ stats.statistics['sensor.warmtepomp_huidig_verbruik'][-1].mean }}"
          COP: 4.66
          Ptherm: "{{ Pelec * COP }}"
          dT: "{{ Tin - Tout }}"
          loss: "{{ (Ptherm / dT) if dT > 0 else 0 }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.loss_per_k
        data:
          value: "{{ loss | round(0) }}"
  

