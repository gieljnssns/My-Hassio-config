homeassistant:
  customize:
    sensor.dark_outside:
      friendly_name: Donker buiten
      icon: mdi:theme-light-dark

    sensor.dark_inside:
      friendly_name: Donker binnen
      icon: mdi:theme-light-dark

    sensor.bad_weather:
      friendly_name: Slecht weer
      icon: mdi:weather-snowy-rainy

    input_boolean.donker_buiten_lowpass:
      hidden: true

    input_boolean.donker_binnen_lowpass:
      hidden: true

input_boolean:
  donker_buiten_lowpass:
  donker_binnen_lowpass:

template:
  - sensor:
      - name: Dark outside
        unique_id: 1852429c-19da-465c-a194-47d20774789b
        state: >
          {% if (states("input_boolean.donker_buiten_lowpass") == 'on') %}
            true
          {% else %}
            false
          {% endif %}
      - name: Dark inside
        unique_id: e17d6c9b-d889-4126-b0c7-900962a8d364
        state: >
          {% if (states("input_boolean.donker_binnen_lowpass") == 'on') %}
            true
          {% else %}
            false
          {% endif %}
      - name: Bad weather
        unique_id: f2c4207a-27a0-437e-b41b-b0294568a981
        state: >
          {% if states("sensor.gedetailleerde_staat") is in ["light-snow", "partlycloudy-light-snow", "partlycloudy-snow", "snowy", "snowy-rainy"] %}
            {% set type = snow %}
          {% elif states("sensor.gedetailleerde_staat") is in ["partlycloudy-light-rain", "partlycloudy-rain", "rainy", "light-rain"] %}
            {% set type = rain %}
          {% endif %}
          {% if type == snow and states("sensor.openweathermap_rain_intensity") | int(default=0) > 0 %}
            snow
          {% elif ((states("sensor.buiten_buiten_temperatuur") | int(0) < 4) and states("sensor.buiten_buiten_dauwpunt") | int(0) < 6 and states("sensor.openweathermap_windsnelheid") | int(0) < 12 and states("sensor.tomorrow_io_home_cloud_cover") | int(0) < 20 and states("sensor.poort_luchtvochtigheid") | int(0) > 50) %} 
            frost
          {% elif type == rain and states("sensor.openweathermap_rain_intensity") | int(default=0) > 7 %} 
            heavy_rain
          {% else %} 
            clear
          {% endif %}
