- sensor:
    - name: Temp living
      unique_id: ced4761b-a79b-41e9-9139-e2311d4b112d
      state: >
        {{ state_attr("climate.living", "current_temperature") | float(18)}}
      unit_of_measurement: "°C"
      availability: >
        {{ state_attr("climate.living", "current_temperature") is number }}

    - name: "Slaapkamer absolute luchtvochtigheid"
      unit_of_measurement: "g/m³"
      unique_id: 29d4890b-6169-42f7-9148-72d1ae77d68b
      state: >
        {% set T = states('sensor.temperatuur_slaapkamer')|float -%}
        {% set RH = states('sensor.slaapkamer_luchtvochtigheid_3')|float -%}
        {% set es = 6.112 * e ** ((17.67*T)/(T+243.5)) -%}
        {{ ((es * RH * 2.1674) / (273.15 + T)) | round(1) }}

    - name: "Slaapkamer Noor absolute luchtvochtigheid"
      unit_of_measurement: "g/m³"
      unique_id: bd298d4d-abdf-4e75-854a-9ee026778bf5
      state: >
        {% set TN = states('sensor.slaapkamer_noor_temperatuur')|float -%}
        {% set RHN = states('sensor.slaapkamer_noor_luchtvochtigheid_3')|float -%}
        {% set esN = 6.112 * e ** ((17.67*TN)/(TN+243.5)) -%}
        {{ ((esN * RHN * 2.1674) / (273.15 + TN)) | round(1) }}

    - name: "Slaapkamer Fien absolute luchtvochtigheid"
      unit_of_measurement: "g/m³"
      unique_id: c7b82b28-3c75-445c-b88f-abfe01b3eb26
      state: >
        {% set TF = states('sensor.slaapkamer_fien_temperatuur')|float -%}
        {% set RHF = states('sensor.slaapkamer_fien_luchtvochtigheid_3')|float -%}
        {% set esF = 6.112 * e ** ((17.67*TF)/(TF+243.5)) -%}
        {{ ((esF * RHF * 2.1674) / (273.15 + TF)) | round(1) }}

    - name: "Badkamer absolute luchtvochtigheid"
      unit_of_measurement: "g/m³"
      unique_id: f593b4b1-bde7-4a8d-a267-467b962c8668
      state: >
        {% set TB = states('sensor.temperatuur_badkamer')|float -%}
        {% set RHB = states('sensor.badkamer_luchtvochtigheid')|float -%}
        {% set esB = 6.112 * e ** ((17.67*TB)/(TB+243.5)) -%}
        {{ ((esB * RHB * 2.1674) / (273.15 + TB)) | round(1) }}

    - name: "Boven absolute luchtvochtigheid"
      unit_of_measurement: "g/m³"
      unique_id: bcf98821-261e-4220-9ed1-da9aca6eda84
      state: >
        {% set TN = states('sensor.slaapkamer_noor_temperatuur')|float -%}
        {% set RHN = states('sensor.slaapkamer_noor_luchtvochtigheid_3')|float -%}
        {% set esN = 6.112 * e ** ((17.67*TN)/(TN+243.5)) -%}
        {% set absN = ((esN * RHN * 2.1674) / (273.15 + TN)) | round(1) -%}

        {% set TF = states('sensor.slaapkamer_fien_temperatuur')|float -%}
        {% set RHF = states('sensor.slaapkamer_fien_luchtvochtigheid_3')|float -%}
        {% set esF = 6.112 * e ** ((17.67*TF)/(TF+243.5)) -%}
        {% set absF = ((esF * RHF * 2.1674) / (273.15 + TF)) | round(1) -%}

        {% set T = states('sensor.temperatuur_slaapkamer')|float -%}
        {% set RH = states('sensor.slaapkamer_luchtvochtigheid_3')|float -%}
        {% set es = 6.112 * e ** ((17.67*T)/(T+243.5)) -%}
        {% set abs = ((es * RH * 2.1674) / (273.15 + T)) | round(1) -%}

        {% set TB = states('sensor.temperatuur_badkamer')|float -%}
        {% set RHB = states('sensor.badkamer_luchtvochtigheid')|float -%}
        {% set esB = 6.112 * e ** ((17.67*TB)/(TB+243.5)) -%}
        {% set absB = ((esB * RHB * 2.1674) / (273.15 + TB)) | round(1) -%}

        {{ ((absN + absF + abs + absB) / 4) | round(1) }}

    - name: "Beneden absolute luchtvochtigheid"
      unit_of_measurement: "g/m³"
      unique_id: dfc2d603-bc6a-42c8-8025-23dc8de5a08a
      state: >
        {% set T = states('sensor.keuken_temperatuur')|float -%}
        {% set RH = states('sensor.keuken_luchtvochtigheid')|float -%}
        {% set es = 6.112 * e ** ((17.67*T)/(T+243.5)) -%}
        {% set abs = ((es * RH * 2.1674) / (273.15 + T)) | round(1) -%}

        {% set TB = states('sensor.temperatuur_living')|float -%}
        {% set RHB = states('sensor.living_luchtvochtigheid')|float -%}
        {% set esB = 6.112 * e ** ((17.67*TB)/(TB+243.5)) -%}
        {% set absB = ((esB * RHB * 2.1674) / (273.15 + TB)) | round(1) -%}

        {{ ((abs + absB) / 2) | round(1) }}

    - name: "Condensatie Marge Keuken"
      unique_id: cond_marge_keuken
      unit_of_measurement: "°C"
      state: >
        {% set T_binnen = states('sensor.keuken_temperatuur') | float(19) -%}
        {% set RH = states('sensor.keuken_luchtvochtigheid') | float(65) -%}
        {% set T_buiten = states('sensor.buiten_temperatuur') | float(10) -%}
        {% set a = 17.27 -%}
        {% set b = 237.7 -%}
        {% set alpha = ((a * T_binnen) / (b + T_binnen)) + (RH / 100.0) | log -%}
        {% set T_dauwpunt = (b * alpha) / (a - alpha) -%}
        {% set Uf = 1.0 -%}
        {% set Rsi = 0.13 -%}
        {% set T_onderdorpel = (T_binnen - (T_binnen - T_buiten) * (Rsi * Uf)) - 2.5 -%}
        {{ (T_onderdorpel - T_dauwpunt) | round(1) }}

    - name: "Condensatie Marge Noor"
      unique_id: cond_marge_noor
      unit_of_measurement: "°C"
      state: >
        {% set T_binnen = states('sensor.slaapkamer_noor_temperatuur_3') | float(17) -%}
        {% set RH = states('sensor.slaapkamer_noor_luchtvochtigheid_3') | float(65) -%}
        {% set T_buiten = states('sensor.buiten_temperatuur') | float(10) -%}
        {% set a = 17.27 -%}
        {% set b = 237.7 -%}
        {% set alpha = ((a * T_binnen) / (b + T_binnen)) + (RH / 100.0) | log -%}
        {% set T_dauwpunt = (b * alpha) / (a - alpha) -%}
        {% set Uf = 1.0 -%}
        {% set Rsi = 0.13 -%}
        {% set T_onderdorpel = (T_binnen - (T_binnen - T_buiten) * (Rsi * Uf)) - 2.5 -%}
        {{ (T_onderdorpel - T_dauwpunt) | round(1) }}

    - name: "Condensatie Marge Slaapkamer"
      unique_id: cond_marge_slaapkamer
      unit_of_measurement: "°C"
      state: >
        {% set T_binnen = states('sensor.slaapkamer_temperatuur_3') | float(17) -%}
        {% set RH = states('sensor.slaapkamer_luchtvochtigheid_3') | float(65) -%}
        {% set T_buiten = states('sensor.buiten_temperatuur') | float(10) -%}
        {% set a = 17.27 -%}
        {% set b = 237.7 -%}
        {% set alpha = ((a * T_binnen) / (b + T_binnen)) + (RH / 100.0) | log -%}
        {% set T_dauwpunt = (b * alpha) / (a - alpha) -%}
        {% set Uf = 1.0 -%}
        {% set Rsi = 0.13 -%}
        {% set T_onderdorpel = (T_binnen - (T_binnen - T_buiten) * (Rsi * Uf)) - 2.5 -%}
        {{ (T_onderdorpel - T_dauwpunt) | round(1) }}

    - name: "Condensatie Marge Fien"
      unique_id: cond_marge_fien
      unit_of_measurement: "°C"
      state: >
        {% set T_binnen = states('sensor.slaapkamer_fien_temperatuur_3') | float(17) -%}
        {% set RH = states('sensor.slaapkamer_fien_luchtvochtigheid_3') | float(65) -%}
        {% set T_buiten = states('sensor.buiten_temperatuur') | float(10) -%}
        {% set a = 17.27 -%}
        {% set b = 237.7 -%}
        {% set alpha = ((a * T_binnen) / (b + T_binnen)) + (RH / 100.0) | log -%}
        {% set T_dauwpunt = (b * alpha) / (a - alpha) -%}
        {% set Uf = 1.0 -%}
        {% set Rsi = 0.13 -%}
        {% set T_onderdorpel = (T_binnen - (T_binnen - T_buiten) * (Rsi * Uf)) - 2.5 -%}
        {{ (T_onderdorpel - T_dauwpunt) | round(1) }}

- binary_sensor:
    - name: Afkoeling gewenst
      unique_id: 61efbf71-ab3f-4e70-8d0f-81eff1e49d46
      state: >
        {{ (states('sensor.gemiddelde_temp_beneden') | float(0)) > (states('sensor.buiten_temperatuur') | float(0)) and
            states('sensor.gemiddelde_temp_beneden') | float(0) > 25 }}
      icon: >
        {% if (states('sensor.gemiddelde_temp_beneden') | float(0)) > (states('sensor.buiten_temperatuur') | float(0)) and
            states('sensor.gemiddelde_temp_beneden') | float(0) > 25 -%}
          mdi:fan
        {% else -%}
          mdi:fan-off
        {% endif -%}

    - name: Thermostat day mode
      unique_id: 78310cea-5406-404f-a065-fc7bcd579dc1
      state: >
        {{ states("alarm_control_panel.ha_alarm") is not in ["armed_night", "armed_away"] }}

    - name: "Condensatie Alarm Keuken"
      unique_id: cond_alarm_keuken
      state: >
        {% set marge = states('sensor.condensatie_marge_keuken') | float(99) -%}
        {{ marge < 1 }}
      device_class: moisture

    - name: "Condensatie Alarm Noor"
      unique_id: cond_alarm_noor
      state: >
        {% set marge = states('sensor.condensatie_marge_noor') | float(99) -%}
        {{ marge < 1 }}
      device_class: moisture

    - name: "Condensatie Alarm Slaapkamer"
      unique_id: cond_alarm_slaapkamer
      state: >
        {% set marge = states('sensor.condensatie_marge_slaapkamer') | float(99) -%}
        {{ marge < 1 }}
      device_class: moisture

    - name: "Condensatie Alarm Fien"
      unique_id: cond_alarm_fien
      state: >
        {% set marge = states('sensor.condensatie_marge_fien') | float(99) -%}
        {{ marge < 1 }}
      device_class: moisture

    - name: Buiten fris genoeg
      unique_id: 5c88bc6c-e453-4ea6-acbb-1eb5bbff493e
      device_class: cold
      state: >
        {{ states('sensor.buitentemperatuur_gefilterd') | float(default=0) < 25 }}

