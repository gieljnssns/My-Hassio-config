      unique_id: 24a544a6-64e9-48db-990a-580099bc48a3
      state: >
        {{ trigger.to_state.state }}
      unit_of_measurement: "°C"

- trigger:
    - trigger: state
      entity_id: sensor.slaapkamer_temperatuur_3
      not_to:
        - unknown
        - unavailable
  sensor:
    - name: Temperatuur slaapkamer
      unique_id: 0dbdbce8-e6f9-4d6b-b1dd-4cd80d96178d
      state: >
        {{ trigger.to_state.state }}
      unit_of_measurement: "°C"

- trigger:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: homeassistant
      event: start
  binary_sensor:
    # ── Beneden: keukendeur ─────────────────────────────────────────────
    - name: "Keukendeur mag open"
      unique_id: 6ab25b3e-1c7b-4960-9ad3-56a1e77b1c01
      device_class: door
      # {{ koeler_buiten and drogere_lucht and geen_condensatie and min_temp and wind_ok }}
      state: >
        {% set is_on     = this.state == 'on' -%}
        {% set t_buiten  = states('sensor.buiten_temperatuur')                  | float(0) -%}
        {% set t_binnen  = states('sensor.gemiddelde_temp_beneden')             | float(0) -%}
        {% set t_buiten_max = states('sensor.max_temperatuur_buiten_voorspelling_12u') | float(99) -%}
        {% set ah_buiten = states('sensor.buiten_absolute_luchtvochtigheid')    | float(0) -%}
        {% set ah_binnen = states('sensor.beneden_absolute_luchtvochtigheid')   | float(0) -%}
        {% set dp_buiten = states('sensor.buiten_dauwpunt')                     | float(0) -%}
        {% set wind      = state_attr("weather.home_2", "wind_speed")         | float(999) -%}
        {% set windvlaag = state_attr("weather.home_2", "wind_gust_speed")   | float(wind) -%}
        {% set koeler_buiten    = t_buiten_max < 26 or t_buiten < (t_binnen - (0.5 if is_on else 1.5)) -%}
        {% set drogere_lucht    = ah_buiten < 15 or ah_buiten <= (ah_binnen + (0.2 if is_on else -0.2)) -%}
        {% set geen_condensatie = dp_buiten < (t_binnen - (0 if is_on else 1)) -%}
        {% set min_temp         = t_buiten >= (4.5 if is_on else 5.5) -%}
        {% set wind_ok          = wind < (34 if is_on else 30) and windvlaag < (50 if is_on else 40) -%}
        {% if t_binnen > 24 -%}
          {{ koeler_buiten }}
        {% else -%}
          {{ koeler_buiten and drogere_lucht and geen_condensatie and min_temp and wind_ok }}
        {% endif -%}
      attributes:
        reden: >
          {% set is_on     = this.state == 'on' -%}
          {% set t_buiten  = states('sensor.buiten_temperatuur')                | float(0) -%}
          {% set t_binnen  = states('sensor.gemiddelde_temp_beneden')           | float(0) -%}
          {% set t_buiten_max = states('sensor.max_temperatuur_buiten_voorspelling_12u') | float(99) -%}
          {% set ah_buiten = states('sensor.buiten_absolute_luchtvochtigheid')  | float(0) -%}
          {% set ah_binnen = states('sensor.beneden_absolute_luchtvochtigheid') | float(0) -%}
          {% set dp_buiten = states('sensor.buiten_dauwpunt')                   | float(0) -%}
          {% set wind      = state_attr("weather.home_2", "wind_speed")       | float(999) -%}
          {% set windvlaag = state_attr("weather.home_2", "wind_gust_speed") | float(wind) -%}
          {% set koeler_buiten    = t_buiten_max < 26 or t_buiten < (t_binnen - (0.5 if is_on else 1.5)) -%}
          {% set drogere_lucht    = ah_buiten < 15 or ah_buiten <= (ah_binnen + (0.2 if is_on else -0.2)) -%}
          {% set geen_condensatie = dp_buiten < (t_binnen - (0 if is_on else 1)) -%}
          {% set min_temp         = t_buiten >= (4.5 if is_on else 5.5) -%}
          {% set wind_ok          = wind < (34 if is_on else 30) and windvlaag < (50 if is_on else 40) -%}
          {% if not min_temp -%}Te koud buiten ({{ t_buiten | round(1) }} °C < {{ 4.5 if is_on else 5.5 }} °C)
          {% elif not wind_ok -%}Te winderig (wind {{ wind | round(1) }} · vlagen {{ windvlaag | round(1) }} m/s)
          {% elif not koeler_buiten -%}Buiten niet koeler (Δ {{ (t_buiten - t_binnen) | round(1) }} °C · max 12u: {{ t_buiten_max | round(1) }} °C)
          {% elif not drogere_lucht -%}Buitenlucht te vochtig (AV buiten {{ ah_buiten | round(2) }} > binnen {{ ah_binnen | round(2) }} g/kg)
          {% elif not geen_condensatie -%}Condensatierisico (dauwpunt {{ dp_buiten | round(1) }} °C)
          {% elif t_buiten_max < 26 -%}Alle voorwaarden OK ✓ (max 12u: {{ t_buiten_max | round(1) }} °C, geen hitte verwacht)
          {% else -%}Alle voorwaarden OK ✓{% endif -%}
      availability: >
        {{ states('sensor.buiten_temperatuur')                    not in ['unavailable','unknown','none']
            and states('sensor.gemiddelde_temp_beneden')           not in ['unavailable','unknown','none']
            and states('sensor.buiten_absolute_luchtvochtigheid')  not in ['unavailable','unknown','none']
            and states('sensor.beneden_absolute_luchtvochtigheid') not in ['unavailable','unknown','none']
            and states('sensor.buiten_dauwpunt')                   not in ['unavailable','unknown','none']
            and state_attr("weather.home_2", "wind_speed")       not in ['unavailable','unknown','none'] }}

