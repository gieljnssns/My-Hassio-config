- trigger:
    - trigger: time_pattern
      minutes: "/15"
  action:
    - action: weather.get_forecasts
      target:
        entity_id: weather.home_2
      data:
        type: hourly
      response_variable: forecast_response
  binary_sensor:
    - name: "Was buiten drogen"
      unique_id: 6f0d8939-82fb-44d1-aa2f-7cd492da7965
      variables:
        now_temp: "{{ states('sensor.buiten_temperatuur') | float(0) }}"
        now_wind: "{{ state_attr('weather.home_2', 'wind_speed') | float(0) }}"
        now_dauwpunt: "{{ states('sensor.buiten_dauwpunt') | float(now_temp) }}"
        now_lux: "{{ states('sensor.buiten_lichtsterkte') | float(0) }}"
        now_abs_vocht: "{{ states('sensor.buiten_absolute_luchtvochtigheid') | float(0) }}"
        conditie: "{{ states('weather.home_2') }}"
        forecast: "{{ forecast_response['weather.home_2']['forecast'][:5] }}"

        temps: "{{ [now_temp] + (forecast | selectattr('temperature', 'defined') | map(attribute='temperature') | list) }}"
        winds: "{{ [now_wind] + (forecast | selectattr('wind_speed', 'defined') | map(attribute='wind_speed') | list) }}"
        dauwpunten: "{{ [now_dauwpunt] + (forecast | selectattr('dew_point', 'defined') | map(attribute='dew_point') | list) }}"
        cloud_cov: "{{ forecast | selectattr('cloud_coverage', 'defined') | map(attribute='cloud_coverage') | select('number') | list }}"

        temp: "{{ (temps | sum) / (temps | length) }}"
        wind: "{{ (winds | sum) / (winds | length) }}"
        dauwpunt: "{{ (dauwpunten | sum) / (dauwpunten | length) }}"
        dp_spread: "{{ temp - dauwpunt }}"

        avg_cloud_cov: "{{ (cloud_cov | sum) / (cloud_cov | length) if cloud_cov | length > 0 else 50 }}"
        licht_forecast_score: "{{ 100 - avg_cloud_cov }}"
        licht_nu_score: "{{ ([now_lux, 30000] | min) / 30000 * 100 }}" # <-- pas 30000 aan naar bv. 600 als je sensor W/m² geeft
        licht_score: "{{ (licht_nu_score + licht_forecast_score) / 2 }}"

        kansen: "{{ forecast | selectattr('precipitation_probability', 'defined') | map(attribute='precipitation_probability') | select('number') | list }}"
        regenkans_forecast: "{{ (kansen | max) if kansen | length > 0 else 0 }}"
        regen_nu: "{{ conditie in ['rainy', 'pouring', 'snowy', 'snowy-rainy', 'hail', 'lightning-rainy'] }}"
        regen_risico: "{{ regenkans_forecast > 40 }}"

        dp_score: "{{ [([dp_spread, 0] | max), 15] | min }}"
        dp_score_pct: "{{ dp_score / 15 * 100 }}"
        wind_score: "{{ ([wind, 20] | min) / 20 * 100 }}"
        temp_clamped: "{{ [([temp, 0] | max), 25] | min }}"
        temp_score: "{{ temp_clamped / 25 * 100 }}"

        droogscore: "{{ (0.35 * dp_score_pct + 0.30 * wind_score + 0.20 * licht_score + 0.15 * temp_score) | round(0) }}"
      state: >
        {% if regen_nu or regen_risico -%}
          off
        {% elif droogscore >= 40 -%}
          on
        {% elif droogscore <= 30 -%}
          off
        {% else -%}
          {{ this.state }}
        {% endif -%}
      attributes:
        droogscore: "{{ droogscore }}"
        regenkans_komende_uren: "{{ regenkans_forecast }}"
        temperatuur_nu: "{{ now_temp }}"
        gem_temperatuur_5u: "{{ temp | round(1) }}"
        dauwpunt_nu: "{{ now_dauwpunt }}"
        gem_dauwpunt_5u: "{{ dauwpunt | round(1) }}"
        dauwpuntspreiding: "{{ dp_spread | round(1) }}"
        absolute_vocht_nu: "{{ now_abs_vocht }}"
        lichtsterkte_nu: "{{ now_lux }}"
        gem_bewolking_5u_pct: "{{ avg_cloud_cov | round(0) }}"
        windsnelheid_nu: "{{ now_wind }}"
        gem_windsnelheid_5u: "{{ wind | round(1) }}"
