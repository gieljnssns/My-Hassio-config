    # - name: Boiler temperatuur laag
    #   unique_id: 59a5bc48-8fe3-478d-87ad-80c0d85b8ff5
    #   state: >
    #     {{ states("sensor.thermostaat") | float(0) <= 42.5 }}
    #   delay_off:
