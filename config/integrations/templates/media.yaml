    - name: Welkom 2
      unique_id: 7bab1cc9-6d44-42ba-9416-55cfdccedcff
      icon: mdi:account-multiple-plus
      state: >-
        {% if is_state("sensor.people_arrive_count", "2") -%}
            {% if is_state("sensor.martine_status", "Juist Aangekomen") and is_state("sensor.noor_status", "Juist Aangekomen") -%}
              {% set person1 = 'Martine' -%}
              {% set person2 = 'Noor' -%}
            {% elif is_state("sensor.martine_status", "Juist Aangekomen") and is_state("sensor.fien_status", "Juist Aangekomen") -%}
              {% set person1 = 'Martine' -%}
              {% set person2 = 'Fien' -%}
            {% elif is_state("sensor.giel_status", "Juist Aangekomen") and is_state("sensor.martine_status", "Juist Aangekomen") -%}
              {% set person1 = 'Giel' -%}
              {% set person2 = 'Martine' -%}
            {% elif is_state("sensor.giel_status", "Juist Aangekomen") and is_state("sensor.noor_status", "Juist Aangekomen") -%}
              {% set person1 = 'Giel' -%}
              {% set person2 = 'Noor' -%}
            {% elif is_state("sensor.giel_status", "Juist Aangekomen") and is_state("sensor.fien_status", "Juist Aangekomen") -%}
              {% set person1 = 'Giel' -%}
              {% set person2 = 'Fien' -%}
            {% else -%}
              {% set person1 = 'Noor' -%}
              {% set person2 = 'Fien' -%}
            {% endif -%}
          {% elif is_state("sensor.people_arrive_count", "3") -%}
            {% if is_state("sensor.giel_status", "Juist Aangekomen") and is_state("sensor.martine_status", "Juist Aangekomen") and is_state("sensor.noor_status", "Juist Aangekomen") -%}
              {% set person1 = 'Giel' -%}
              {% set person2 = 'Martine' -%}
              {% set person3 = 'Noor' -%}
            {% elif is_state("sensor.giel_status", "Juist Aangekomen") and is_state("sensor.fien_status", "Juist Aangekomen") and is_state("sensor.noor_status", "Juist Aangekomen") -%}
              {% set person1 = 'Giel' -%}
              {% set person2 = 'Noor' -%}
              {% set person3 = 'Fien' -%}
            {% elif is_state("sensor.giel_status", "Juist Aangekomen") and is_state("sensor.martine_status", "Juist Aangekomen") and is_state("sensor.fien_status", "Juist Aangekomen") -%}
              {% set person1 = 'Giel' -%}
              {% set person2 = 'Martine' -%}
              {% set person3 = 'Fien' -%}
            {% elif is_state("sensor.martine_status", "Juist Aangekomen") and is_state("sensor.noor_status", "Juist Aangekomen") and is_state("sensor.fien_status", "Juist Aangekomen") -%}
              {% set person1 = 'Martine' -%}
              {% set person2 = 'Noor' -%}
              {% set person3 = 'Fien' -%}
            {% endif -%}
          {% else -%}
            {% set person1 = 'Giel' -%}
            {% set person2 = 'Martine' -%}
            {% set person3 = 'Noor' -%}
            {% set person4 = 'Fien' -%}
          {% endif -%}

          {% if is_state("sensor.people_arrive_count", "2") -%}
            {{ [
            "Hallo " + person1 + " en " + person2 + " welkom thuis",
            "Hallo " + person1 + " en " + person2 + "  blij dat jullie veilig thuis geraakt zijn"
            ] | random }}
          {% elif is_state("sensor.people_arrive_count", "3") -%}
