- binary_sensor:
    - name: "Battery Power Valid"
      unique_id: 7f8a9b2c-3d4e-5f6g-7h8i-9j0k1l2m3n4o
      device_class: power
      state: >
        {% set operation_mode = states('select.goodwe_inverter_operation_mode') -%}
        {% set eco_power_percent = states('number.goodwe_eco_mode_power') | int("unavailable") -%}
        {% set power = (states('sensor.battery_power') | int("unavailable")) -%}

        {#- Check of inverter in laden of ontladen staat -#}
        {% if operation_mode == "unknown" or eco_power_percent == "unavailable" or power == "unavailable" -%}
          {{ true }}
        {% elif operation_mode != 'eco_charge' and operation_mode != 'eco_discharge' -%}
          {{ true }}
        {% elif eco_power_percent == 0 -%}
          {{ true }}
        {% elif operation_mode == 'eco_charge' -%}
          {{ ((power / 80) | round(0)|int) * -1 == eco_power_percent }}
        {% else -%}
          {{ (power / 80) | round(0)|int == eco_power_percent }}
        {% endif -%}
      delay_off:
        seconds: 30

    - name: "Battery dead zone"
      unique_id: 6fa867df-6a6f-4f6b-a772-9e7637b46ab2
      device_class: problem
      state: >
        {% set to_100 = as_timestamp(states("input_datetime.soc_to_100")) -%}
        {% set from_100 = as_timestamp(states("input_datetime.soc_from_100")) -%}
        {% set now = as_timestamp(now()) -%}
        {% if states("sensor.battery_state_of_charge") | float(0) == 100 -%}
          {% if (now - to_100) > 301 -%}
            True
          {% else -%}
            False
          {% endif -%}
        {% elif states("sensor.battery_state_of_charge") | float(0) == 99 -%}
          {% if (now - from_100) < 300 -%}
            True
          {% else -%}
            False
          {% endif -%}
        {% else -%}
          False
        {% endif %}
