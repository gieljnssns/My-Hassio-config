- trigger:
    - trigger: time_pattern
      minutes: "/5"

  binary_sensor:
    - name: "Battery SOC valid"
      unique_id: 118928b6-f95b-4f30-bfb9-c10681997c20

      state: >
        {% set previous_soc = this.attributes.previous_soc
            if this.attributes.previous_soc is defined
            else states('sensor.battery_state_of_charge') | float(0) -%}

        {% set current_soc =
            states('sensor.battery_state_of_charge') | float(0) -%}

        {% set actual_drop = previous_soc - current_soc -%}

        {% set max_drop = 2 -%}

        {{ actual_drop <= max_drop }}

      attributes:
        previous_soc: >
          {{ states('sensor.battery_state_of_charge') | float(0) }}

        current_soc: >
          {{ states('sensor.battery_state_of_charge') | float(0) }}

        actual_drop: >
          {% set previous_soc = this.attributes.previous_soc
              if this.attributes.previous_soc is defined
              else states('sensor.battery_state_of_charge') | float(0) -%}

          {% set current_soc =
              states('sensor.battery_state_of_charge') | float(0) -%}

          {{ (previous_soc - current_soc) | round(2) }}
  sensor:
    - name: Minimum steps till 100
      unit_of_measurement: 5m
      unique_id: f9ced06a-099f-485e-94b3-5bb2aa4dce23
      state: >
        {% set capacity = 35.5 -%}
        {% set soc = states('sensor.battery_state_of_charge')|float(0) / 100 -%}
        {% set remaining = capacity * (1 - soc) -%}
        {% set grid = 2500 -%}
        {% set battery_max = 8000 -%}
        {% set steps = min((states('sensor.steps_till_100')|int(0) + 20), 320) -%}
        {% set pv = ([states('sensor.gemiddelde_opbrengst_5m')|int(0)] + (state_attr('sensor.pv_power_forecast_list_interpolated', 'list') or [])[1:steps]) -%}
        {% set load = (state_attr('sensor.ridge_p_load_forecast','forecasts') or [])[:steps] |map(attribute='ridge_p_load_forecast')|map('float',0)|list -%}
        {% set def0 = (state_attr('sensor.ridge_p_deferrable0','deferrables_schedule') or [])[:steps] |map(attribute='ridge_p_deferrable0')|map('float',0)|list -%}
        {% set def1 = (state_attr('sensor.ridge_p_deferrable1','deferrables_schedule') or [])[:steps] |map(attribute='ridge_p_deferrable1')|map('float',0)|list -%}
        {% set def2 = (state_attr('sensor.ridge_p_deferrable2','deferrables_schedule') or [])[:steps] |map(attribute='ridge_p_deferrable2')|map('float',0)|list -%}
        {% set def3 = (state_attr('sensor.ridge_p_deferrable3','deferrables_schedule') or [])[:steps] |map(attribute='ridge_p_deferrable3')|map('float',0)|list -%}
        {% set def4 = (state_attr('sensor.ridge_p_deferrable4','deferrables_schedule') or [])[:steps] |map(attribute='ridge_p_deferrable4')|map('float',0)|list -%}
        {% if remaining <= 0 -%}
          0
        {% else -%}
          {% set n = [steps, pv|length, load|length, def0|length, def1|length, def2|length, def3|length, def4|length]|min -%}
          {% set ns = namespace(energy=0, result=n) -%}
          {% for i in range(n) -%}
            {% set surplus = pv[i]|float(0) - load[i] - def0[i] - def1[i] - def2[i] - def3[i] - def4[i] -%}
            {% set charge_power = [[surplus + grid, 0]|max, battery_max]|min -%}
            {% set ns.energy = ns.energy + charge_power / 12000 -%}
            {% if ns.energy >= remaining and ns.result == n -%}
              {% set ns.result = i + 1 -%}
            {% endif -%}
          {% endfor -%}
            {{ ns.result }}
        {% endif -%}

- sensor:
    - name: "Steps till 100"
      unique_id: d1bc25c9-f2e0-4673-b6fe-f6593a1d8374
      unit_of_measurement: 5m
      # Als kleiner dan 2 -> +1
      state: >
        {% set raw_start = states("input_datetime.soc_from_100") -%}
        {% set start = as_timestamp(raw_start) -%}
        {% set start_dt = as_datetime(start) | as_local -%}
        {% set target = (start_dt + timedelta(days=3)) -%}
        {% set time = 16 if target.weekday() < 5 else 18 -%}
        {% set target = target.replace(hour=time, minute=0, second=0) -%}
        {% set diff = as_timestamp(target) - as_timestamp(now()) -%}
        {% set steps = (diff / 300) | int -%}
        {% if steps < 2 -%}
          {% set steps = 1 -%}
        {% endif -%}

        {{ [steps, 0] | max }}

    - name: "Battery P Charge Max"
      unique_id: 368202ee-72a6-47e2-aad2-9c3570cb825f
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set soc = states('sensor.battery_state_of_charge') | float(states('sensor.emhass_soc')|float) -%}
        {% set temp = states('sensor.battery_temperature') | float(10) -%}
        {% set voltage = states('sensor.battery_voltage') | float(501) -%}

        {#- Bepaal de laadstroom op basis van SOC -#}
        {% if soc < 90 -%}
          {% set charge_soc = 18 -%}
        {% elif soc < 95 -%}
          {% set charge_soc = 10 -%}
        {% elif soc < 99 -%}
          {% set charge_soc = 10 -%}
        {% elif soc < 100 and (states("sensor.steps_till_100") | int > 1000) -%}
          {% set charge_soc = 0 -%}
        {% elif soc < 100 -%}
          {% set charge_soc = 10 -%}
        {% else -%}
          {% set charge_soc = 0 -%}
        {% endif -%}

        {#- Bepaal de laadstroom op basis van temperatuur -#}
        {% if temp < -10 -%}
          {% set charge_temp = 0 -%}
        {% elif temp < -5 -%}
          {% set charge_temp = 0 -%}
        {% elif temp < 0 -%}
          {% set charge_temp = 1 -%}
        {% elif temp < 5 -%}
          {% set charge_temp = 14 -%}
        {% elif temp < 10 -%}
          {% set charge_temp = 22 -%}
        {% elif temp < 40 -%}
          {% set charge_temp = 22 -%}
        {% elif temp < 45 -%}
          {% set charge_temp = 22 -%}
        {% elif temp < 50 -%}
          {% set charge_temp = 18 -%}
        {% elif temp < 55 -%}
          {% set charge_temp = 18 -%}
        {% else -%}
          {% set charge_temp = 0 -%}
        {% endif -%}

        {#- Neem het minimum van beide -#}
        {% set max_current = [charge_soc, charge_temp] | min -%}

        {#- GoodWe GW8K-BT omvormer limiet: max 25A laadstroom -#}
        {% set inverter_max_charge = 25 -%}
        {% set final_current = [max_current, inverter_max_charge] | min -%}

        {#- Converteer naar Watt (P = U x I) -#}
        {% set power = final_current * voltage -%}

        {#- Limiet op 8000W AC (omvormer max) -#}
        {{ [power, 8000] | min | round(0) }}

    - name: "Battery P Discharge Max"
      unique_id: 634b09f5-0a4b-4098-9c02-0720f7a31326
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set soc = states('sensor.battery_state_of_charge') | float(states('sensor.emhass_soc')|float) -%}
        {% set temp = states('sensor.battery_temperature') | float(10) -%}
        {% set voltage = states('sensor.battery_voltage') | float(501) -%}
        {% set remaining = state_attr("sensor.pv_power_forecast_list_interpolated", "remaining") | int -%}

        {#- Bepaal de ontlaadstroom op basis van SOC -#}
        {% if soc < 5 -%}
          {% set discharge_soc = 0 -%}
        {% elif soc < 10 -%}
          {% set discharge_soc = 5 -%}
        {% elif soc < 20 -%}
          {% set discharge_soc = 5 -%}
        {% elif soc < 30 -%}
          {% set discharge_soc = 18 -%}
        {% elif soc < 40 -%}
          {% set discharge_soc = 18 -%}
        {% elif soc < 50 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 60 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 70 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 80 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 90 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 100 -%}
          {% set discharge_soc = 22 -%}
        {% else -%}
          {% set discharge_soc = 22 -%}
        {% endif -%}

        {#- Bepaal de ontlaadstroom op basis van temperatuur -#}
        {% if temp < -10 -%}
          {% set discharge_temp = 0 -%}
        {% elif temp < -5 -%}
          {% set discharge_temp = 6 -%}
        {% elif temp < 0 -%}
          {% set discharge_temp = 9 -%}
        {% elif temp < 5 -%}
          {% set discharge_temp = 14 -%}
        {% elif temp < 10 -%}
          {% set discharge_temp = 22 -%}
        {% elif temp < 40 -%}
          {% set discharge_temp = 22 -%}
        {% elif temp < 45 -%}
          {% set discharge_temp = 22 -%}
        {% elif temp < 50 -%}
          {% set discharge_temp = 18 -%}
        {% elif temp < 55 -%}
          {% set discharge_temp = 18 -%}
        {% else -%}
          {% set discharge_temp = 0 -%}
        {% endif -%}

        {#- Neem het minimum van beide -#}
        {% set max_current = [discharge_soc, discharge_temp] | min -%}

        {#- GoodWe GW8K-BT omvormer limiet: max 25A ontlaadstroom -#}
        {% set inverter_max_discharge = 25 -%}
        {% set final_current = [max_current, inverter_max_discharge] | min -%}

        {#- Converteer naar Watt (P = U x I) -#}
        {% set power = final_current * voltage -%}
        {#- Limiet op 8000W AC (omvormer max) -#}
        {% set limit =  [power, 8000] | min | round(0) -%}
        {{ limit if remaining < 30 else 8000 }}

