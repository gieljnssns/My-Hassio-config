- binary_sensor:
    - name: Warmtepomp aan
      device_class: power
      unique_id: c8bb853c-63ec-4fd1-b18f-05624ee48fde
      state: >
        {{ states('sensor.warmtepomp_huidig_verbruik') | float(default=0) > 25 }}
    - name: Warmtepomp aan delay off
      device_class: power
      unique_id: befaae46-c7b5-4d6c-80ad-2b93d3eb6b96
      state: >
        {{ states('sensor.warmtepomp_huidig_verbruik') | float(default=0) > 25 }}
      delay_off:
        minutes: 10

- trigger:
    - trigger: state
      entity_id: binary_sensor.warmtepomp_aan
      from: "off"
      to: "on"
  sensor:
    - name: "Warmtepomp is gestart op…"
      unique_id: 80b7a7bd-0a7c-4dd2-bf0a-c277e273cc2f
      state: >
        {{ as_timestamp(states.binary_sensor.warmtepomp_aan.last_changed) }}

- trigger:
    - trigger: state
      entity_id: binary_sensor.warmtepomp_aan
      from: "on"
      to: "off"
  sensor:
    - name: "Warmtepomp is gestopt op…"
      unique_id: d427fb27-4606-4cc7-a30a-e3421c367f60
      state: >
        {{ as_timestamp(states.binary_sensor.warmtepomp_aan.last_changed) }}
