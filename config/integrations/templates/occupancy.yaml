- sensor:
    - name: People home
      unique_id: 8e651710-4133-4790-a780-7ad400573558
      state: >
        {{ expand("binary_sensor.fien_bayesian", "binary_sensor.martine_bayesian", "binary_sensor.noor_bayesian", "binary_sensor.giel_bayesian")
                    | selectattr("state", "eq", "on")
                    | map(attribute="entity_id")
                    | list
                    | count }}

- binary_sensor:
    - name: Keuken bezetting
      unique_id: eafab40b-50d3-4244-bff6-41ce584c53ce
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.keuken_aqara_pir', 'on')
            or is_state('binary_sensor.keuken_presence', 'on')
            or is_state('binary_sensor.keuken_pir_delay', 'on')
            or states('sensor.keuken_person_count') | int(0) > 0 }}

    - name: Badkamer bezetting
      unique_id: da5f7441-6d4d-4326-b274-dc7002e83298
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.badkamer_presence', 'on')
            or is_state('binary_sensor.badkamer_still_target', 'on')
            or is_state('binary_sensor.badkamer_moving_target', 'on')
            or is_state('binary_sensor.badkamer_pir_delay', 'on') }}

    - name: Living bezetting
      unique_id: 83253a76-14ae-4842-b554-9cd21324c362
      device_class: occupancy
      delay_off:
        seconds: 10
      state: >
        {{  is_state('binary_sensor.zithoek_bezetting', 'on')
            or is_state('binary_sensor.danszaal_bezetting', 'on') }}

    - name: Danszaal bezetting
      unique_id: 3ddc256e-8a57-4c88-9354-d1f8f0458f67
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.danszaal_aqara_pir', 'on')
            or is_state('binary_sensor.danszaal_still_target', 'on')
            or is_state('binary_sensor.danszaal_moving_target', 'on')
            or is_state('binary_sensor.danszaal_presence', 'on') }}

    - name: Zithoek bezetting
      unique_id: 24236364-25f6-4b03-be23-cb6e2428a22d
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.zithoek_aqara_pir', 'on')
            or is_state('binary_sensor.zithoek_still_target', 'on')
            or is_state('binary_sensor.zithoek_moving_target', 'on')
            or is_state('binary_sensor.zithoek_presence', 'on')
            or states('sensor.living_person_count') | int(0) > 0 }}

    - name: Tuin bezetting
      unique_id: efa6d545-9ecc-4b8c-9919-1236957d31e7
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.tuin_person_occupancy', 'on')
            or is_state('binary_sensor.afdak_person_occupancy', 'on') }}

    - name: Noor bezetting
      unique_id: cf897eeb-ba92-433a-87e5-d337ca69b8a1
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.slaapkamer_noor_presence', 'on')
            or is_state('binary_sensor.slaapkamer_noor_still_target', 'on')
            or is_state('binary_sensor.slaapkamer_noor_moving_target', 'on')
            or is_state('binary_sensor.slaapkamer_noor_bezetting', 'on') }}

    - name: Fien bezetting
      unique_id: cb63613c-2171-414f-b3ea-b1a09f595901
      device_class: occupancy
      delay_off:
        seconds: 30
      state: >
        {{  is_state('binary_sensor.slaapkamer_fien_presence', 'on')
            or is_state('binary_sensor.slaapkamer_fien_still_target', 'on')
            or is_state('binary_sensor.slaapkamer_fien_moving_target', 'on')
            or is_state('binary_sensor.slaapkamer_fien_bezetting', 'on') }}

    - name: Noor thuis nacht
      unique_id: cd492f22-4546-4a46-b747-bf597257e422
      delay_on:
        minutes: 10
      state: >
        {{ states('device_tracker.nphone') == 'home' and
          states('alarm_control_panel.ha_alarm') == 'armed_night' }}

    - name: Fien thuis nacht
      unique_id: bf89f4d5-1098-4c3f-9bb8-beb0473fc3da
      delay_on:
        minutes: 10
      state: >
        {{ states('device_tracker.fphone') == 'home' and
          states('alarm_control_panel.ha_alarm') == 'armed_night' }}

- trigger:
    - trigger: template
      id: aan
      value_template: >
        {{ states('device_tracker.gphone_2') == 'home' and
          states('alarm_control_panel.ha_alarm') == 'armed_night' }}
      for:
        minutes: 10
    - trigger: template
      id: uit
      value_template: >
        {{ states("binary_sensor.gphone_focus") == "off" and states('alarm_control_panel.ha_alarm') == 'disarmed' }}
  binary_sensor:
    - name: Giel thuis nacht
      unique_id: a5f7fb80-700e-4883-afa1-39171f29208d
      # delay_on:
      #   minutes: 60
      state: >
        {{ states('device_tracker.gphone_2') == 'home' and
          states('alarm_control_panel.ha_alarm') == 'armed_night' }}

- trigger:
    - trigger: template
      id: aan
      value_template: >
        {{ states('device_tracker.mphone_2') == 'home' and
          states('alarm_control_panel.ha_alarm') == 'armed_night' }}
      for:
        minutes: 10
    - trigger: template
      id: uit
      value_template: >
        {{ states("binary_sensor.mphone_focus") == "off" and states('alarm_control_panel.ha_alarm') == 'disarmed' }}
  binary_sensor:
    - name: Martine thuis nacht
      unique_id: 62c3a0c9-3737-45ff-bcae-a038ef985811
      # delay_on:
      #   minutes: 60
      state: >
        {{ states('device_tracker.mphone_2') == 'home' and
          states('alarm_control_panel.ha_alarm') == 'armed_night' }}
