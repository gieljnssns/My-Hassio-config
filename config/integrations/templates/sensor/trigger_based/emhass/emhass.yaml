    - name: Emhass load
      unique_id: 9fdc600a-94c4-4bfc-b11a-2cad784faa46
      unit_of_measurement: W
      state_class: measurement
      state: >
        {% set best_model = states('sensor.best_emhass_model_load_7d') | lower -%}
        {{ states('sensor.' + best_model + '_p_load_forecast') }}
      attributes:
        model_used: "{{ states('sensor.best_emhass_model_load_7d') }}"
        forecasts: >
          {% set best_model = states('sensor.best_emhass_model_load_7d') | lower -%}
          {% set forecasts = state_attr('sensor.' + best_model + '_p_load_forecast', 'forecasts') -%}
          {% set values = namespace(list=[]) -%}

          {% if forecasts -%}
            {% for forecast in forecasts -%}
              {% set key = best_model + '_p_load_forecast' -%}
              {% set values.list = values.list + [forecast[key] | float] -%}
