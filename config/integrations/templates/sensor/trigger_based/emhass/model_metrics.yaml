# =============================================================================
# ERROR METRICS PER MODEL
# =============================================================================
# RIDGE MODEL
- trigger:
    - platform: state
      entity_id: sensor.emhass_load_ridge
      not_to:
        - unknown
        - unavailable
  sensor:
    - name: "Emhass Load Error Ridge"
      unique_id: emhass_load_error_ridge
      unit_of_measurement: "W"
      state_class: measurement
      state: >
        {% set actual = states('sensor.huidig_verbruik_zonder_wp_gefilterd') | float(0) -%}
        {% set forecast = states('sensor.emhass_load_ridge') | float(0) -%}
        {{ (actual - forecast) | abs }}
      attributes:
        actual: "{{ states('sensor.huidig_verbruik_zonder_wp_gefilterd') | float(0) }}"
        forecast: "{{ states('sensor.emhass_load_ridge') | float(0) }}"
        error_percentage: >
          {% set actual = states('sensor.huidig_verbruik_zonder_wp_gefilterd') | float(0) -%}
          {% set forecast = states('sensor.emhass_load_ridge') | float(0) -%}
          {% if actual > 0 -%}
            {{ ((actual - forecast) | abs / actual * 100) | round(2) }}
          {% else -%}
            0
          {% endif -%}
    
- trigger:
    - platform: state
      entity_id: sensor.emhass_grid_ridge
      not_to:
        - unknown
        - unavailable
  sensor:
    - name: "Emhass Grid Error Ridge"
      unique_id: emhass_grid_error_ridge
      unit_of_measurement: "W"
      state_class: measurement
      state: >
        {% set actual = states('sensor.huidig_fluvius') | float(0) -%}
        {% set forecast = states('sensor.emhass_grid_ridge') | float(0) -%}
        {{ (actual - forecast) | abs }}

