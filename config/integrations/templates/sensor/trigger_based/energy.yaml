- trigger:
    # - platform: state
    #   entity_id: sensor.energy_production_today
    #   not_to:
    #     - unknown
    #     - unavailable
    # - platform: state
    #   entity_id: sensor.energy_production_today_2
    #   not_to:
    #     - unknown
    #     - unavailable
    # - platform: state
    #   entity_id: sensor.energy_production_today_3
    #   not_to:
    #     - unknown
    #     - unavailable
    - platform: time_pattern
      minutes: /5
    - platform: homeassistant
      event: start
  sensor:
    - name: Open meteo voorspelling vandaag
      unique_id: 0337653c-eaf4-485d-baed-4f283dc03d21
      unit_of_measurement: "kWh"
      device_class: energy
      state: >
        {% set badkamer = states("sensor.energy_production_today_3") | float(0) -%}
        {% set huis = states("sensor.energy_production_today_2") | float(0) -%}
        {% set garage = states("sensor.energy_production_today") | float(0) -%}
          {{ (garage + huis + badkamer) | round(2) }}
      attributes:
        watts: >-
          {% if (
            state_attr('sensor.energy_production_today', 'watts') != none and
            state_attr('sensor.energy_production_today_2', 'watts') != none and
            state_attr('sensor.energy_production_today_3', 'watts') != none
          ) -%}
            {% set garage = state_attr('sensor.energy_production_today', 'watts') -%}
            {% set huis = state_attr('sensor.energy_production_today_2', 'watts') -%}
            {% set badkamer = state_attr('sensor.energy_production_today_3', 'watts') -%}
            {% set ns = namespace(output={}) %}
            {% for time, value in garage.items() %}
              {% set sum_value = value + huis[time] + badkamer[time] %}
              {% set ns.output = dict({time: sum_value}, **ns.output) %}
            {% endfor -%}
            {{ ns.output }}
          {% endif -%}
        wh_period: >-
          {% if (
            state_attr('sensor.energy_production_today', 'wh_period') != none and
            state_attr('sensor.energy_production_today_2', 'wh_period') != none and
            state_attr('sensor.energy_production_today_3', 'wh_period') != none
          ) -%}
            {% set garage = state_attr('sensor.energy_production_today', 'wh_period') -%}
            {% set huis = state_attr('sensor.energy_production_today_2', 'wh_period') -%}
            {% set badkamer = state_attr('sensor.energy_production_today_3', 'wh_period') -%}
            {% set ns = namespace(output={}) -%}
            {% for time, value in garage.items() -%}
              {% set sum_value = value + huis[time] + badkamer[time] -%}
              {% set ns.output = dict({time: sum_value}, **ns.output) -%}
            {% endfor -%}
            {{ ns.output }}
          {% endif -%}
            
