    - name: Open meteo voorspelling vandaag huawei
      unique_id: 5ea37fe4-b9d8-4ac6-9d06-7f0c245d2157
      unit_of_measurement: "kWh"
      device_class: energy
      state: >
        {% set huis = states('sensor.energy_production_today_2') | float(default=0) %}
        {% set badkamer = states('sensor.energy_production_today_3') | float(default=0) %}
        {{ (huis + badkamer) | round(2) }}
      attributes:
        watts: >-
          {% set huis = state_attr('sensor.energy_production_today_2', 'watts') %}
          {% set badkamer = state_attr('sensor.energy_production_today_3', 'watts') %}
          {% set ns = namespace(output={}) %}
          {% for time, value in huis.items() %}
            {% set sum_value = value + badkamer[time] %}
            {% set ns.output = dict({time: sum_value}, **ns.output) %}
          {% endfor %}
            {{ ns.output }}
        wh_period: >-
          {% set huis = state_attr('sensor.energy_production_today_2', 'wh_period') %}
          {% set badkamer = state_attr('sensor.energy_production_today_3', 'wh_period') %}
          {% set ns = namespace(output={}) %}
          {% for time, value in huis.items() %}
            {% set sum_value = value + badkamer[time] %}
            {% set ns.output = dict({time: sum_value}, **ns.output) %}
          {% endfor %}
            {{ ns.output }}

    - name: Open meteo voorspelling resterend vandaag
