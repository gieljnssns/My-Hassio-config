- trigger:
    # - trigger: state
    #   entity_id: sensor.nord_pool_be_huidige_prijs
    - trigger: homeassistant
      event: start
    # - trigger: time
    #   at: "13:00:00"  # Wanneer prijzen voor morgen beschikbaar komen
    - trigger: time_pattern
      minutes: "/5" # Update elke 5 minuten voor actuele prijs
  action:
    - variables:
        today: "{{ now().strftime('%Y-%m-%d') }}"
        tomorrow: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
    - action: nordpool.get_price_indices_for_date
      data:
        config_entry: "01K6AQ2E1S68NG1XCN4D99YVDC"
        date: "{{ today }}"
        resolution: "15"
      response_variable: today_prices
    - action: nordpool.get_price_indices_for_date
      data:
        config_entry: "01K6AQ2E1S68NG1XCN4D99YVDC"
        date: "{{ tomorrow }}"
        resolution: "15"
      response_variable: tomorrow_prices
  sensor:
    - name: "NordPool raw"
      unique_id: 755b77c7-468f-439b-b566-eea89f093b01
      unit_of_measurement: "EUR/kWh"
      state: >
        {% set quarter_index = (now().minute // 15) -%}
        {% set current_hour = now().hour -%}
        {% set current_time_index = current_hour * 4 + quarter_index -%}

        {% set today_prices_data = today_prices.BE if today_prices and 'BE' in today_prices else [] -%}
        {% set tomorrow_prices_data = tomorrow_prices.BE if tomorrow_prices and 'BE' in tomorrow_prices else [] -%}

        {% set today_remaining = today_prices_data[current_time_index:] if today_prices_data|length > current_time_index else [] -%}
        {% set all_prices = today_remaining + tomorrow_prices_data -%}

        {% if all_prices|length > 0 -%}
          {% set current_price = (all_prices[0].price / 1000) -%}
          {{ current_price }}
        {% else -%}
          {{ 0 }}
        {% endif -%}
      attributes:
        raw_today_prices: "{{ today_prices.BE if today_prices and 'BE' in today_prices else [] }}"
        raw_tomorrow_prices: "{{ tomorrow_prices.BE if tomorrow_prices and 'BE' in tomorrow_prices else [] }}"
