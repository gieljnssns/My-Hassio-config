    - trigger: state
      entity_id: sensor.zonnetent_lichtsterkte
      not_to:
        - unknown
        - unavailable
  sensor:
    - name: Buiten lichtsterkte
      unique_id: 2668b502-27ec-4046-a4b7-c52444181fe1
      state: >
        {% set list = [ states("sensor.achtergevel_lichtsterkte") | float(0),
                        states("sensor.zonnetent_lichtsterkte") | float(0),
                        states("sensor.zijgevel_lichtsterkte") | float(0)] -%}
        {{ list | map('float') | max }}
      unit_of_measurement: "lx"

