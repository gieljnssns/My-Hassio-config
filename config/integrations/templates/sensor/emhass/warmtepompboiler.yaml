    - name: Warm water startuur
      unique_id: f4450d07-ad80-4ed5-a96a-852c84fec6ca
      state: >
        {% from 'easy_time.jinja' import easy_relative_time -%}
        {% set best_model = states('sensor.best_emhass_model_load_7d') | lower -%}
        {% set load = (state_attr('sensor.' + best_model + '_p_deferrable3', 'deferrables_schedule')
                |map(attribute=best_model + '_p_deferrable3')
                |list) -%}
        {% set time = (state_attr('sensor.' + best_model + '_p_deferrable3', 'deferrables_schedule')
                |map(attribute='date')
                |list) -%}
        {% if is_state("input_boolean.emhass_warmtepompboiler", "on") -%}
          Staat op
        {% else -%}
          {% set new_list = namespace(all=[]) -%}
            {% for i in range (load | length) -%}
              {% if load[i] | float(0) > 1 -%}
                {{ (easy_relative_time(time [i], max_period='minute', language='nl')) }}
                {% break -%}
              {% endif -%}
            {% endfor -%}
          {% endif -%}
      availability: >-
        {{ states('sensor.best_emhass_model_load_7d') not in ('unknown', 'unavailable', 'None') }}

    - name: Warmtepompboiler start timesteps
      unique_id: b9a1f40e-00d6-48b4-9a9b-b7d558e78357
      unit_of_measurement: 5m
      state: >
        {% if (as_timestamp(now()) - states("sensor.warmtepompboiler_is_gestopt_op")|float(0)) < 1500 -%}
          6
        {% else -%}
          0
        {% endif -%}

    - name: Warmtepompboiler end timesteps
      unique_id: 108e2881-9ac7-49ef-baab-2631da9ab3f4
      unit_of_measurement: 5m
      state: >
        {% set uren = states("sensor.warmtepompboiler_uren") | float(0) -%}
        {% set operate = uren * 12 -%}
        {% set hour = now().hour -%}
        {% set minute = now().minute -%}
        {% set block = hour * 12 + (minute // 5) -%}
        {% set remaining = 288 - block -%}
        {% if states("sensor.thermostaat") | int(43) < 43 or states("binary_sensor.warmtepompboiler_aan") == "on" -%}
          {{ operate | int }}
        {% elif uren == 0 -%}
          {{ 288 }}
        {% elif uren >= 1.5 -%}
          {{ min(operate, remaining) | int }}
        {% else -%}
          {% set factor = uren / 1.5 -%}
          {% set max_blocks = 288 - (factor * (288 - operate)) -%}
          {{ min(max_blocks, remaining) | int }}
        {% endif -%}
