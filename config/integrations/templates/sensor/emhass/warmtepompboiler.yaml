- sensor:
    - name: Warmtepompboiler uren
      unique_id: 8225bcd3-62ca-40af-8891-ba06a95eed91
      unit_of_measurement: "uur"
      state: >
        {% set temp = (states("sensor.thermostaat") | float(45) * 4) | round(0) / 4 -%}
        {% set temp_in = states("sensor.boiler_in") | float(18) -%}
        {% set delta = (temp - temp_in) > 30 -%}

        {% if states("input_boolean.warm_water_starten") == 'on' -%}
            {% if states("input_boolean.op_verlof") == 'off' -%}
              {% set target_temp = 49.2 -%}
            {% else -%}
              {% set target_temp = 46 -%}
            {% endif -%}
            
            {#- Bereken basis uren -#}
            {% set base_hours = (max(0, (target_temp - temp) / 5) * 4) | round(0) / 4 -%}
            {#- Extra uren bij waterverbruik -#}
            {% if temp < (target_temp - 2) %}
              {% set extra_hours = 1.0 if delta else 0 -%}
            {% elif temp < (target_temp - 1) -%}
              {% set extra_hours = 0.5 if delta else 0 -%}
            {% else -%}
              {% set extra_hours = 0 -%}
            {% endif -%}
            {% set hours = base_hours + extra_hours -%}
            
            {% if is_state("binary_sensor.warmtepompboiler_aan", "on") -%}
              {{ hours }}
            {% else -%}
              {{ hours if hours >= 0.5 else 0 }}
            {% endif -%}
        {% else -%}
          0
        {% endif -%}
