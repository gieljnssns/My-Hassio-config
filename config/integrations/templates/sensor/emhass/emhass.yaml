    - name: Soc maximum
      unique_id: 264ff207-7267-4425-ad74-a50722033556
      state: >
        {% set forecast_list = state_attr('sensor.pv_power_forecast_list_interpolated', 'list') or [] -%}
        {% set soc = states('sensor.battery_state_of_charge')|float(0) -%}
        {% set result = namespace(first_zero_index = None) -%}
        {% for value in forecast_list -%}
          {% if value == 0 and result.first_zero_index is none -%}
            {% set result.first_zero_index = loop.index0 -%}
          {% endif -%}
        {% endfor -%}
        {% if result.first_zero_index|int(0) < 12 -%}
          0.85
        {% else -%}
          1
        {% endif -%}
