- sensor:
    # Prediction horizon steeds lager dan "num_lags" in de fit actie
    - name: Prediction horizon
      unique_id: 39144142-06b5-4c2a-897a-d24b0c8fd2e4
      unit_of_measurement: 5m
      state: >
        {% set buy_sensor = 'sensor.ecopower_afnameprijzen_predicted' if states('sensor.ecopower_afnameprijzen_predicted') not in ('unknown', 'unavailable', 'None') else 'sensor.ecopower_afnameprijzen' -%}
        {% set sell_sensor = 'sensor.ecopower_injectieprijzen_predicted' if states('sensor.ecopower_injectieprijzen_predicted') not in ('unknown', 'unavailable', 'None') else 'sensor.ecopower_injectieprijzen' -%}

        {% set buy = state_attr(buy_sensor, 'prijzen') | length if state_attr(buy_sensor, 'prijzen') else 0 -%}
        {% set sell = state_attr(sell_sensor, 'prijzen') | length if state_attr(sell_sensor, 'prijzen') else 0 -%}
        {% set pv = state_attr('sensor.pv_power_forecast_list_interpolated', 'list') | length if state_attr('sensor.pv_power_forecast_list_interpolated', 'list') else 0 -%}
        {% set total = [buy, sell, pv, 360] | min -%}

        {% set droogkast = states("sensor.droogkast_end_timesteps") | int(0) if states("sensor.droogkast_end_timesteps") | int(0) < total else total -%}
        {% set wasmachien = states("sensor.wasmachien_end_timesteps") | int(0) if states("sensor.wasmachien_end_timesteps") | int(0) < total else total -%}
        {% set afwasmachien = states("sensor.afwasmachien_end_timesteps") | int(0) if states("sensor.afwasmachien_end_timesteps") | int(0) < total else total -%}
        {% set endstep = max(droogkast, wasmachien, afwasmachien) -%}

        {{ (total, endstep) | max }}
      availability: >
        {{ (states('sensor.ecopower_afnameprijzen_predicted') not in ('unknown', 'unavailable', 'None') or 
            states('sensor.ecopower_afnameprijzen') not in ('unknown', 'unavailable', 'None')) and
          (states('sensor.ecopower_injectieprijzen_predicted') not in ('unknown', 'unavailable', 'None') or 
            states('sensor.ecopower_injectieprijzen') not in ('unknown', 'unavailable', 'None')) and
          states('sensor.pv_power_forecast_list_interpolated') not in ('unknown', 'unavailable', 'None') }}

