    - name: Prediction horizon span
      unique_id: 4413a66d-72e7-498b-9a9d-56eb43907fae
      state: >
        {% set horizon = states("sensor.prediction_horizon")|int(0) -%}
        {{ (((horizon*5)-30)|int(0)|string + "min")|string }}

    - name: Days to retrieve
      unique_id: 175a282e-93d8-428a-b702-954438886b79
      unit_of_measurement: days
      state: >
        {% from 'easy_time.jinja' import count_the_days -%}
        {% set days = count_the_days("2024-08-01 00:00:00") | int(0) -%}
        {{ (((days * -1) - 1), 725) | min }}

    - name: "Battery P Charge Max"
      unique_id: 368202ee-72a6-47e2-aad2-9c3570cb825f
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set soc = states('sensor.battery_state_of_charge') | float(0) -%}
        {% set temp = states('sensor.battery_temperature') | float(0) -%}
        {% set voltage = states('sensor.battery_voltage') | float(501) -%}

        {#- Bepaal de laadstroom op basis van SOC -#}
        {% if soc < 5 -%}
          {% set charge_soc = 22 -%}
        {% elif soc < 10 -%}
          {% set charge_soc = 22 -%}
        {% elif soc < 20 -%}
          {% set charge_soc = 22 -%}
        {% elif soc < 30 -%}
          {% set charge_soc = 22 -%}
        {% elif soc < 40 -%}
          {% set charge_soc = 22 -%}
        {% elif soc < 50 -%}
          {% set charge_soc = 22 -%}
        {% elif soc < 60 -%}
          {% set charge_soc = 18 -%}
        {% elif soc < 70 -%}
          {% set charge_soc = 18 -%}
        {% elif soc < 80 -%}
          {% set charge_soc = 18 -%}
        {% elif soc < 90 -%}
          {% set charge_soc = 18 -%}
        {% elif soc < 100 -%}
          {% set charge_soc = 8 -%}
        {% else -%}
          {% set charge_soc = 0 -%}
        {% endif -%}

        {#- Bepaal de laadstroom op basis van temperatuur -#}
        {% if temp < -10 -%}
          {% set charge_temp = 0 -%}
        {% elif temp < -5 -%}
          {% set charge_temp = 0 -%}
        {% elif temp < 0 -%}
          {% set charge_temp = 1 -%}
        {% elif temp < 5 -%}
          {% set charge_temp = 14 -%}
        {% elif temp < 10 -%}
          {% set charge_temp = 22 -%}
        {% elif temp < 40 -%}
          {% set charge_temp = 22 -%}
        {% elif temp < 45 -%}
          {% set charge_temp = 22 -%}
        {% elif temp < 50 -%}
          {% set charge_temp = 18 -%}
        {% elif temp < 55 -%}
          {% set charge_temp = 18 -%}
        {% else -%}
          {% set charge_temp = 0 -%}
        {% endif -%}

        {#- Neem het minimum van beide -#}
        {% set max_current = [charge_soc, charge_temp] | min -%}

        {#- GoodWe GW8K-BT omvormer limiet: max 25A laadstroom -#}
        {% set inverter_max_charge = 25 -%}
        {% set final_current = [max_current, inverter_max_charge] | min -%}

        {#- Converteer naar Watt (P = U x I) -#}
        {% set power = final_current * voltage -%}

        {#- Limiet op 8000W AC (omvormer max) -#}
        {{ [power, 8000] | min | round(0) }}

    - name: "Battery P Discharge Max"
      unique_id: 634b09f5-0a4b-4098-9c02-0720f7a31326
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set soc = states('sensor.battery_state_of_charge') | float(0) -%}
        {% set temp = states('sensor.battery_temperature') | float(0) -%}
        {% set voltage = states('sensor.battery_voltage') | float(501) -%}

        {#- Bepaal de ontlaadstroom op basis van SOC -#}
        {% if soc < 5 -%}
          {% set discharge_soc = 0 -%}
        {% elif soc < 10 -%}
          {% set discharge_soc = 5 -%}
        {% elif soc < 20 -%}
          {% set discharge_soc = 5 -%}
        {% elif soc < 30 -%}
          {% set discharge_soc = 18 -%}
        {% elif soc < 40 -%}
          {% set discharge_soc = 18 -%}
        {% elif soc < 50 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 60 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 70 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 80 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 90 -%}
          {% set discharge_soc = 22 -%}
        {% elif soc < 100 -%}
          {% set discharge_soc = 22 -%}
        {% else -%}
          {% set discharge_soc = 22 -%}
        {% endif -%}

        {#- Bepaal de ontlaadstroom op basis van temperatuur -#}
        {% if temp < -10 -%}
          {% set discharge_temp = 0 -%}
        {% elif temp < -5 -%}
          {% set discharge_temp = 6 -%}
        {% elif temp < 0 -%}
          {% set discharge_temp = 9 -%}
        {% elif temp < 5 -%}
          {% set discharge_temp = 14 -%}
        {% elif temp < 10 -%}
          {% set discharge_temp = 22 -%}
        {% elif temp < 40 -%}
          {% set discharge_temp = 22 -%}
        {% elif temp < 45 -%}
          {% set discharge_temp = 22 -%}
        {% elif temp < 50 -%}
          {% set discharge_temp = 18 -%}
        {% elif temp < 55 -%}
          {% set discharge_temp = 18 -%}
        {% else -%}
          {% set discharge_temp = 0 -%}
        {% endif -%}

        {#- Neem het minimum van beide -#}
        {% set max_current = [discharge_soc, discharge_temp] | min -%}

        {#- GoodWe GW8K-BT omvormer limiet: max 25A ontlaadstroom -#}
        {% set inverter_max_discharge = 25 -%}
        {% set final_current = [max_current, inverter_max_discharge] | min -%}

        {#- Converteer naar Watt (P = U x I) -#}
        {% set power = final_current * voltage -%}

        {#- Limiet op 8000W AC (omvormer max) -#}
        {{ [power, 8000] | min | round(0) }}

