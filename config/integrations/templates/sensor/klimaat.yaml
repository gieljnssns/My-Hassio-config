- sensor:
    - name: Temp living
      unique_id: ced4761b-a79b-41e9-9139-e2311d4b112d
      state: >
        {{ state_attr("climate.living", "current_temperature") | float(18)}}
      unit_of_measurement: "°C"
      availability: >
        {{ state_attr("climate.living", "current_temperature") is number }}
    
    - name: "Condensatie Marge Keuken"
      unique_id: cond_marge_keuken
      unit_of_measurement: "°C"
      state: >
        {% set T_binnen = states('sensor.keuken_temperatuur') | float(19) %}
        {% set RH = states('sensor.keuken_luchtvochtigheid') | float(65) %}
        {% set T_buiten = states('sensor.buiten_temperatuur') | float(10) %}
        {% set a = 17.27 %}
        {% set b = 237.7 %}
        {% set alpha = ((a * T_binnen) / (b + T_binnen)) + (RH / 100.0) | log %}
        {% set T_dauwpunt = (b * alpha) / (a - alpha) %}
        {% set Uf = 1.0 %}
        {% set Rsi = 0.13 %}
        {% set T_onderdorpel = (T_binnen - (T_binnen - T_buiten) * (Rsi * Uf)) - 2.5 %}
        {{ (T_onderdorpel - T_dauwpunt) | round(1) }}
    
