        {% set Uf = 1.0 %}
        {% set Rsi = 0.13 %}
        {% set T_onderdorpel = (T_binnen - (T_binnen - T_buiten) * (Rsi * Uf)) - 2.5 %}
        {{ (T_onderdorpel - T_dauwpunt) | round(1) }}
    
