## emhass_timestep
    - name: Prediction horizon oud
      unique_id: 81f0ab8c-45c8-42cb-a7da-4b0516172908
      # unit_of_measurement: 1/2u
      unit_of_measurement: 1/4u
      availability: >
        {{ state_attr('sensor.pv_power_forecast_list', 'list') | length | is_number and 
            states("sensor.wasmachien_end_timesteps") | is_number and 
            states("sensor.droogkast_end_timesteps") | is_number and 
            states("sensor.afwasmachien_end_timesteps") | is_number }}
      state: >
        {% set prediction = state_attr('sensor.pv_power_forecast_list', 'list') %}
        {% macro max(X, Y) %} {{X|int(0) if X|int(0) > Y|int(0) else Y|int(0) }} {% endmacro %}
        {% macro min(X, Y) %} {{X|int(0) if X|int(0) < Y|int(0) else Y|int(0) }} {% endmacro %}
        {% set hour = now().hour %}
        {% set minutes = now().minute %}
        {% if prediction is iterable %}
          {% set solar = prediction | length %}
        {% else %}
          {% set solar = 96 %}
        {% endif %}
        {% set endstep = max(states('sensor.wasmachien_end_timesteps'), states('sensor.droogkast_end_timesteps')) %}
        {% set endstep = max(endstep, states('sensor.afwasmachien_end_timesteps')) %}

        {% if hour == 7 %}
          {{ min(96, max(endstep, min(solar, 68))) if minutes < 15 else
            min(96, max(endstep, min(solar, 67))) if minutes < 30 else
            min(96, max(endstep, min(solar, 66))) if minutes < 45 else
            min(96, max(endstep, min(solar, 65))) }}
        {% elif hour == 8 %}
          {{ min(96, max(endstep, min(solar, 64))) if minutes < 15 else
            min(96, max(endstep, min(solar, 63))) if minutes < 30 else
            min(96, max(endstep, min(solar, 62))) if minutes < 45 else
            min(96, max(endstep, min(solar, 61))) }}
        {% elif hour == 9 %}
          {{ min(96, max(endstep, min(solar, 60))) if minutes < 15 else
            min(96, max(endstep, min(solar, 59))) if minutes < 30 else
            min(96, max(endstep, min(solar, 58))) if minutes < 45 else
