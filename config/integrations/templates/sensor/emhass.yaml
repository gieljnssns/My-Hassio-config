      unit_of_measurement: "uur"
      state: >
        {% set hours = states('input_number.voorspelde_uren')|float - states('sensor.branduren_warmtepomp')|float %}
        {% set hour = now().hour %}
        {% if 0 <= hour < 7 %}
          0
        {% elif states("input_boolean.verwarming_starten") == 'on' %}
          {% if states('input_number.voorspelde_uren')|float > 1 -%} 
            {{ hours }} 
          {% else %} 
            0 
          {% endif %}
        {% else %}
          0
        {% endif %}
## emhass_timestep
    - name: Warmtepompboiler uren
      unique_id: 8225bcd3-62ca-40af-8891-ba06a95eed91
      unit_of_measurement: "uur"
      state: >
        {% set horizon = states('sensor.prediction_horizon')|int(0) / 4 %}
        {% set temp = (states("sensor.thermostaat") | float(45) * 4) | round(0) / 4 %}
        {% set temp = states("sensor.thermostaat") | float(45) %}
        {% macro max(X, Y) -%} {{X|float(0)if X|float(0)> Y|float(0)else Y|float(0)}} {% endmacro %}
        {% if states("input_boolean.warm_water_starten") == 'on' %}
          {% if states("input_boolean.op_verlof") == 'off' %}
            {% if (states("sensor.open_meteo_voorspelling_resterend_vandaag") | float(0)) > 2 %}
              {% set hours =  max(0, (53 - temp) / 4)  %}
            {% else %}
              {% set hours =  max(0, (52 - temp) / 4)  %}
            {% endif %}
          {% else %}
            {% set hours =  max(0, (46 - temp) / 4)  %}
          {% endif %}
          {% if hours|float > horizon %}
            {{ horizon }}
          {% else %}
            {{ (hours|float * 4) | round(0) / 4}}
          {% endif %}
        {% else %}
          0
        {% endif %}

## emhass_timestep
    - name: Pv power forecast list
      unique_id: 6bc0c511-9c6f-4778-b13e-a20e3646a7e5
      state: >
        {{ states("sensor.open_meteo_voorspelling_vandaag") }}
      attributes:
        list: >
          {% set data = state_attr('sensor.open_meteo_voorspelling_vandaag', 'watts') -%}
          {% set data2 = state_attr('sensor.open_meteo_voorspelling_morgen', 'watts') -%}
          {% if data is not none and data2 is not none -%}
            {% set now = as_timestamp(now()) -%}
            {% set items = data.items() | list -%}
            {% set sorted = items | sort(attribute=0) -%}
            {% set items2 = data2.items() | list -%}
            {% set sorted2 = items2 | sort(attribute=0) -%}
            
            {% set ns = namespace(result=[]) -%}
            {% for timestring, value in sorted -%}
              {% set time = as_timestamp(as_datetime(timestring)) -%}
              {% if time >= now -%}
                {% set ns.result = ns.result + [value] -%}
              {% endif -%}
            {% endfor -%}
            {% set today = ns.result -%}

            {% set ns = namespace(result2=[]) -%}
            {% for timestring, value in sorted2 -%}
              {% set time = as_timestamp(as_datetime(timestring)) -%}
              {% if time >= now -%}
                {% set ns.result2 = ns.result2 + [value] -%}
              {% endif -%}
            {% endfor -%}
            {% set tomorrow = ns.result2 -%}
            {{ today + tomorrow }}
          {% endif -%}

