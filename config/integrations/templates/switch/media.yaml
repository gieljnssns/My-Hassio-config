- switch:
    - name: Playstation spelen met muziek
      unique_id: fe4e90a2-1db1-47a9-a0f3-024a9b0c572b
      state: >
        {{ is_state('script.playstation_on', 'on') }}
      turn_on:
        - action: script.playstation_on
      turn_off:
        - action: script.playstation_off
      default_entity_id: switch.playstation
      icon: mdi:sony-playstation

    - name: Badkamer2Keuken
      unique_id: 3c8b1fe1-6769-4d07-81e2-f864c9ffacd7
      state: >
        {{ state_attr('media_player.mass_badkamer', 'active_queue') | string ==
          "RINCON_5CAAFD0F5D3C01400" | string }}
      turn_on:
        - action: media_player.join
          data:
            group_members:
              - media_player.mass_badkamer
          target:
            entity_id:
              - media_player.mass_keuken
      turn_off:
        - action: media_player.unjoin
          target:
            entity_id:
              - media_player.mass_badkamer
      default_entity_id: switch.badkamer2keuken
      icon: mdi:music-box-multiple

    - name: Living2Keuken
      unique_id: 58adb0f2-d645-40a3-9544-5211bedcfaed
      state: >
        {{ state_attr('media_player.mass_living_2', 'active_queue') | string ==
          "RINCON_5CAAFD0F5D3C01400" | string }}
      turn_on:
        - action: media_player.join
          data:
            group_members:
              - media_player.mass_living_2
          target:
            entity_id:
              - media_player.mass_keuken
      turn_off:
        - action: media_player.unjoin
          target:
            entity_id:
              - media_player.mass_living_2
      default_entity_id: switch.living2keuken
      icon: mdi:music-box-multiple

    - name: 2c2Keuken
      unique_id: 3f7394eb-6b95-4e89-9b04-7bdcd88b090d
      state: >
        {{ state_attr('media_player.mass_2c', 'active_queue') | string ==
          "RINCON_5CAAFD0F5D3C01400" | string }}
      turn_on:
        - action: media_player.join
          data:
            group_members:
              - media_player.mass_2c
          target:
            entity_id:
              - media_player.mass_keuken
      turn_off:
        - action: media_player.unjoin
          target:
            entity_id:
              - media_player.mass_2c
      default_entity_id: switch.2c2keuken
