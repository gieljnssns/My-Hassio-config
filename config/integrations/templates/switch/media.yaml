    - name: Incognito
      unique_id: 5a6ddcd0-8510-48bb-85c9-97900d867c70
      turn_on:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.tuin_detect
              - switch.afdak_detect
              - switch.keuken_detect
              - switch.living_detect
        - action: automation.turn_off
          target:
            entity_id:
              - automation.licht_hof_aan
              - automation.den_hof_occupancy
              - automation.garage_occupancy
        - action: automation.turn_on
          target:
            entity_id:
              - automation.poort_gphone
              - automation.event_trigger
      turn_off:
        - action: switch.turn_on
          target:
            entity_id:
              - switch.tuin_detect
              - switch.afdak_detect
              - switch.keuken_detect
              - switch.living_detect
        - action: automation.turn_on
          target:
            entity_id:
              - automation.licht_hof_aan
              - automation.den_hof_occupancy
              - automation.garage_occupancy
        - action: automation.turn_off
          target:
            entity_id:
              - automation.poort_gphone
              - automation.event_trigger
      default_entity_id: switch.incognito
