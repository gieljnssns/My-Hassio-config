    - name: Move2Keuken
      unique_id: 13326cd4-33f1-40d4-9192-865bea3544ce
      state: >
        {{ state_attr('media_player.mass_move', 'active_queue') | string ==
          "RINCON_5CAAFD0F5D3C01400" | string }}
      turn_on:
        - action: media_player.join
          data:
            group_members:
              - media_player.mass_move
          target:
            entity_id:
              - media_player.mass_keuken
      turn_off:
        - action: media_player.unjoin
          target:
            entity_id:
              - media_player.mass_move
      default_entity_id: switch.move2keuken
