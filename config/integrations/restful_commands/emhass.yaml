  method: POST
  timeout: 300
  content_type: "application/json"
  payload: >-
    {
    "csv_file": "prediction.csv",
    "features":["dd", "solar"],
    "target": "hour",
    "regression_model": "RandomForestRegression",
    "model_type": "heating_dd",
    "timestamp": "timestamp",
    "date_features": ["month", "day_of_week"]
    }

