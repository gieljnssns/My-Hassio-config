verluchting_badkamer_10m:
  sequence:
    - condition: state
      entity_id: binary_sensor.afkoeling_gewenst
      state: "off"
    - action: switch.turn_on
      entity_id: switch.badkamer_verluchting
    - action: input_datetime.set_datetime
      data:
        datetime: >
          {% set current = states("input_datetime.verluchting_end_time") -%}
          {% if as_timestamp(current) > as_timestamp(now() + timedelta(minutes=10)) -%}
            {{ current }}
          {% else -%}
            {{ now() + timedelta(minutes=10) }}
          {% endif -%}
      target:
        entity_id: input_datetime.verluchting_end_time # the entity used in the off time trigger

